<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Model Viewer</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2b2f2e; font-family: system-ui, sans-serif; }
  .info { position: fixed; left: 12px; top: 12px; color: #dfe3df; font-size: 12px; white-space: pre; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
</head>
<body>
<div class="info" id="info">Loading…</div>
<script type="module">
// Quick look at a model: shows it from a chosen side (?view=front|side|top|back) with its bounding box size.
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight('#ffffff', '#555555', 2.2));
const key = new THREE.DirectionalLight('#ffffff', 1.5);
key.position.set(2, 3, 4);
scene.add(key);
const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.01, 100);

// ?crop=x0,x1,y0,y1 (model units) shows only that part of the sheet
const params = new URLSearchParams(location.search);
renderer.localClippingEnabled = true;

new GLTFLoader().load('models/trailbound.glb', gltf => {
  const model = gltf.scene;
  scene.add(model);
  let box = new THREE.Box3().setFromObject(model);
  if (params.get('crop')) {
    const [x0, x1, y0, y1] = params.get('crop').split(',').map(Number);
    const planes = [
      new THREE.Plane(new THREE.Vector3(1, 0, 0), -x0), new THREE.Plane(new THREE.Vector3(-1, 0, 0), x1),
      new THREE.Plane(new THREE.Vector3(0, 1, 0), -y0), new THREE.Plane(new THREE.Vector3(0, -1, 0), y1),
    ];
    model.traverse(o => { if (o.material) o.material.clippingPlanes = planes; });
    box = new THREE.Box3(new THREE.Vector3(x0, y0, box.min.z), new THREE.Vector3(x1, y1, box.max.z));
  }
  const size = box.getSize(new THREE.Vector3()), center = box.getCenter(new THREE.Vector3());
  const view = params.get('view') || 'front';
  const dist = Math.max(size.x, size.y, size.z) * 2.4;
  const dir = { front: [0, 0, 1], back: [0, 0, -1], side: [1, 0, 0], top: [0, 1, 0.001] }[view];
  camera.position.copy(center).add(new THREE.Vector3(...dir).multiplyScalar(dist));
  camera.lookAt(center);
  scene.add(new THREE.Box3Helper(box, '#ff6a3d'));
  document.getElementById('info').textContent = `view: ${view}\nsize: ${size.x.toFixed(2)} x ${size.y.toFixed(2)} x ${size.z.toFixed(2)}`;
  window.modelReady = true;
});
renderer.setAnimationLoop(() => renderer.render(scene, camera));
</script>
</body>
</html>
