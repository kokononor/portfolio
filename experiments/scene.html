<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hero Scene</title>
<style>
  html { background: #000; }
  body { margin: 0; background: #000; color: #fff; font-family: system-ui, sans-serif; overflow-x: hidden; }
  canvas { display: block; }

  /* a tall scroll track; the stage sticks while scrolling flies the camera through the scene */
  .track { position: relative; height: 320vh; }
  .stage { position: sticky; top: 0; height: 100vh; overflow: hidden; }
  .stage canvas { position: absolute; inset: 0; }

  .curtain { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; color: #cdb998; font-size: 13px;
    background: #000; transition: opacity 2.6s ease; }
  body.ready .curtain { opacity: 0; pointer-events: none; }

  /* dev controls for tuning the environment */
  .ui { position: fixed; left: 16px; bottom: 16px; z-index: 5; display: none; gap: 10px; flex-wrap: wrap; align-items: center;
    background: rgba(0,0,0,.45); padding: 8px 12px; border-radius: 14px; color: #f3e6cf; font-size: 12px; }
  .ui button { background: rgba(255,240,215,.08); color: #f3e6cf; border: 1px solid rgba(255,240,215,.25);
    padding: 6px 12px; border-radius: 999px; cursor: pointer; font-size: 12px; }
  .ui label { display: flex; gap: 6px; align-items: center; }
  body.dev .ui { display: flex; }   /* developer controls: add ?dev to the URL */

  /* embedded in the home page: one screen tall, transparent while loading (the page shows a still underneath) */
  body.embed .track { height: 100vh; }
  body.embed, html.embed { background: transparent; overflow: hidden; }
  body.embed .curtain { display: none; }

  @media (prefers-reduced-motion: reduce) { .curtain { transition: none; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
</head>
<body>
<div class="curtain" id="curtain">Building the world…</div>
<section class="track" id="track">
  <div class="stage" id="stage"></div>
</section>
<div class="ui">
  <label>Sun height <input id="sunH" type="range" min="2" max="14" step="0.1" value="6"></label>
  <button id="atmoBtn">Atmosphere: on</button>
</div>
<script type="module">
import * as THREE from 'three';
if (new URLSearchParams(location.search).has('dev')) document.body.classList.add('dev');
const EMBED = new URLSearchParams(location.search).has('embed') && window.parent !== window;
const DUOTONE = new URLSearchParams(location.search).has('duotone');
const INK = new URLSearchParams(location.search).has('ink');
if (EMBED) { document.body.classList.add('embed'); document.documentElement.classList.add('embed'); }
// the host page reports its scroll (0..1 through the camera move) and whether the hero is visible
const embedState = { scroll: 0, visible: true };
if (EMBED) addEventListener('message', e => {
  if (e.origin !== location.origin || !e.data || e.data.source !== 'home') return;
  if (typeof e.data.scroll === 'number') embedState.scroll = Math.min(Math.max(e.data.scroll, 0), 1);
  if (typeof e.data.visible === 'boolean') embedState.visible = e.data.visible;
});
const REDUCED_MOTION = matchMedia('(prefers-reduced-motion: reduce)').matches;
// devices without WebGL 2 get a calm message instead of a broken canvas
if (!document.createElement('canvas').getContext('webgl2')) {
  document.getElementById('curtain').textContent = 'This scene needs WebGL 2, which this browser does not support.';
  throw new Error('WebGL 2 unavailable');
}
import { mergeVertices, mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { Pass, FullScreenQuad } from 'three/addons/postprocessing/Pass.js';
import { FXAAShader } from 'three/addons/shaders/FXAAShader.js';

// ================= Palette (sRGB hex, converted to linear by THREE.Color) =================
// Art direction, from the references: bold golden backlight; deep, cool teal-green shadows framing a glowing centre;
// luminous warm haze towards the sun, blue haze away from it; clean saturated greens; small warm accents
// (amber, rose, terracotta). Concept-board palette: #1f2620 #4b5a2c #9aa346 #f2b350 #c96a2c #b84a5a.
const PALETTE = {
  // sky + light
  zenith:     '#4f86b8',  // clear soft blue high up
  mid:        '#d6cbb2',  // pale aqua-sage
  horizon:    '#ffc98a',  // gold at the horizon
  ground:     '#e2b98a',
  glow:       '#ffbf66',  // the sun: rich gold
  cloudLit:   '#ffd9a8',  // peach-gold cloud edges
  cloudShade: '#9aa3b4',  // lavender-blue cloud bodies
  haze:       '#efcd9c',  // distance haze looking towards the sun
  sunLow:     '#ffbb6e',  // key light: golden
  sunHigh:    '#ffe6c2',
  skyFill:    '#8fa9bb',  // cool blue sky light: shadows go teal, not grey
  groundFill: '#3c4024',  // warm olive bounce from the ground
  // terrain
  mud:        '#4a3f30',
  water:      '#1d4862',  // deep blue under the reflections
  backdrop:   '#8c9eae',  // far ranges: blue
  // valley mist
  mistLit:    '#ebd0a2',  // mist glowing where the sun reaches it
  mistShade:  '#8fa3b2',  // cool blue mist in the shade
  fogCool:    '#9cb3c6',  // haze colour looking away from the sun
};
const col = hex => new THREE.Color(hex);
const pal = (...hexes) => hexes.map(col);
const clamp01 = v => THREE.MathUtils.clamp(v, 0, 0.999);
// pick from a palette with a little blending towards a neighbour, so no two things match exactly
function varied(palette, r1, r2, out = new THREE.Color()) {
  const i = Math.floor(clamp01(r1) * palette.length);
  return out.copy(palette[i]).lerp(palette[(i + 1) % palette.length], THREE.MathUtils.clamp(r2, 0, 1) * 0.5);
}
const smooth = (a, b, x) => { const t = THREE.MathUtils.clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }; // GLSL-style, works with a > b

// ================= Valley mist =================
// Replaces three.js's fog chunks so every fogged material also gets height mist:
// thick near the valley floor, thinning with height, broken up by slowly drifting noise,
// glowing gold when you look towards the sun. Tree bases and islands dissolve into it.
const mistUniforms = {
  fogTime: { value: 0 },
  fogSunDir: { value: null }, // set once sunDir exists
  mistLit: { value: col(PALETTE.mistLit) },
  mistShade: { value: col(PALETTE.mistShade) },
  fogCool: { value: col(PALETTE.fogCool) },
  fogIntro: { value: 1 },
};
THREE.ShaderChunk.fog_pars_vertex = /* glsl */`
  #ifdef USE_FOG
    varying float vFogDepth;
    varying vec3 vFogWorld;
  #endif`;
THREE.ShaderChunk.fog_vertex = /* glsl */`
  #ifdef USE_FOG
    vFogDepth = - mvPosition.z;
    vFogWorld = cameraPosition + (vec4(mvPosition.xyz, 0.0) * viewMatrix).xyz; // view space -> world space
  #endif`;
THREE.ShaderChunk.fog_pars_fragment = /* glsl */`
  #ifdef USE_FOG
    uniform vec3 fogColor;
    uniform float fogDensity;
    uniform float fogTime;
    uniform vec3 fogSunDir, mistLit, mistShade, fogCool;
    uniform float fogIntro;
    varying float vFogDepth;
    varying vec3 vFogWorld;
    float mHash(vec2 p) { return fract(sin(dot(p, vec2(41.3, 289.1))) * 43758.5453); }
    float mNoise(vec2 p) {
      vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
      return mix(mix(mHash(i), mHash(i + vec2(1, 0)), f.x), mix(mHash(i + vec2(0, 1)), mHash(i + vec2(1, 1)), f.x), f.y);
    }
    float mFbm(vec2 p) { return 0.5 * mNoise(p) + 0.3 * mNoise(p * 2.1 + 5.3) + 0.2 * mNoise(p * 4.3 + 1.7); }
  #endif`;
THREE.ShaderChunk.fog_fragment = /* glsl */`
  #ifdef USE_FOG
    vec3 viewDir = normalize(vFogWorld - cameraPosition);
    // distance haze with aerial perspective: golden towards the sun, cooler grey-green away from it
    float toSun = max(dot(viewDir, fogSunDir), 0.0);
    vec3 hazeCol = mix(fogCool, fogColor, pow(toSun, 4.0)) * (1.0 + 0.35 * pow(toSun, 10.0)); // haze glows around the sun
    float fogFactor = 1.0 - exp(- fogDensity * fogDensity * vFogDepth * vFogDepth);
    gl_FragColor.rgb = mix(gl_FragColor.rgb, hazeCol, fogFactor);

    // valley mist
    float mn = mFbm(vFogWorld.xz * 0.006 + vec2(fogTime * 0.012, fogTime * 0.005));
    float mistTop = 22.0 + 22.0 * (mn - 0.5);   // low-lying: hilltops and trees rise out of it
    float heightAmt = 1.0 - smoothstep(-6.0, mistTop, vFogWorld.y);
    float mist = heightAmt * (1.0 - exp(- vFogDepth * 0.0075)) * (0.7 + 0.5 * mn);
    vec3 mistCol = mix(mistShade, mistLit, pow(max(dot(viewDir, fogSunDir), 0.0), 4.0));
    gl_FragColor.rgb = mix(gl_FragColor.rgb, mistCol, clamp(mist, 0.0, 0.97));
    // intro: everything starts inside golden fog that burns off, nearest things first
    gl_FragColor.rgb = mix(gl_FragColor.rgb, mistLit, fogIntro * (1.0 - exp(- vFogDepth * 0.03)));
  #endif`;
const addMist = shader => Object.assign(shader.uniforms, mistUniforms);

// ================= Renderer, scene, camera =================
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1));  // start sharp at the screen's own resolution; adapt upwards if there is headroom
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.9;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false; // the shadow casters barely move; re-render shadows only when something changes
let shadowFrames = 12;
const markShadowsDirty = (frames = 3) => { shadowFrames = Math.max(shadowFrames, frames); };
document.getElementById('stage').prepend(renderer.domElement);
// If the GPU drops the context (driver reset, too many tabs), rebuild cleanly instead of showing a blank page
renderer.domElement.addEventListener('webglcontextlost', e => { e.preventDefault(); renderer.setAnimationLoop(null); });

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(col(PALETTE.haze), 0.00085); // far ranges keep their ridges; valley depth comes from the low mist

// Camera sits high on the cliff ledge, looking slightly down into the valley
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.5, 4000);
camera.position.set(0, 60, 0);
camera.lookAt(0, 52, -100);

// ================= Wind: the mouse is a wind wand =================
// A small screen-space velocity grid. Moving the pointer pushes air the way it moves; the gust spreads out and dies away.
// Shaders read it as a texture (leaves, grass, fog, water, dust); JS reads it directly (tarp, lantern, mist banks).
const WIND_W = 64, WIND_H = 36;
const windVX = new Float32Array(WIND_W * WIND_H), windVY = new Float32Array(WIND_W * WIND_H);
const windTmpX = new Float32Array(WIND_W * WIND_H), windTmpY = new Float32Array(WIND_W * WIND_H);
const windData = new Uint8Array(WIND_W * WIND_H * 4);
const windTex = new THREE.DataTexture(windData, WIND_W, WIND_H, THREE.RGBAFormat, THREE.UnsignedByteType);
windTex.magFilter = windTex.minFilter = THREE.LinearFilter;
windTex.needsUpdate = true;
const drawSize = renderer.getDrawingBufferSize(new THREE.Vector2());
const windUniforms = { windTex: { value: windTex }, resolution: { value: drawSize } };
const WIND_GLSL = /* glsl */`
  uniform sampler2D windTex;
  vec2 windAtUv(vec2 uv) { return (texture2D(windTex, clamp(uv, 0.0, 1.0)).rg - 0.5) * 2.0; }
  vec2 windAtClip(vec4 clip) { return windAtUv(clip.xy / clip.w * 0.5 + 0.5); }
`;

const pointer = { x: 0.5, y: 0.5, px: 0.5, py: 0.5, seen: false, moved: false };
addEventListener('pointermove', e => {
  pointer.x = e.clientX / innerWidth;
  pointer.y = 1 - e.clientY / innerHeight;
  if (!pointer.seen) { pointer.px = pointer.x; pointer.py = pointer.y; pointer.seen = true; } // no jump on entry
  pointer.moved = true;
});
// a tap or click sends a ring of wind outwards (the touch-screen version of the wand)
addEventListener('pointerdown', e => splat(e.clientX / innerWidth, 1 - e.clientY / innerHeight, 0.16, (dx, dy, g) => {
  const len = Math.hypot(dx, dy) + 1e-4;
  return [dx / len * g * 1.2, dy / len * g * 1.2];
}));

function splat(u, v, radius, force) {
  const aspect = innerWidth / innerHeight, r2 = radius * radius;
  const x0 = Math.max(0, Math.floor((u - radius * 2 / aspect) * WIND_W)), x1 = Math.min(WIND_W - 1, Math.ceil((u + radius * 2 / aspect) * WIND_W));
  const y0 = Math.max(0, Math.floor((v - radius * 2) * WIND_H)), y1 = Math.min(WIND_H - 1, Math.ceil((v + radius * 2) * WIND_H));
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const dx = ((x + 0.5) / WIND_W - u) * aspect, dy = (y + 0.5) / WIND_H - v;
    const g = Math.exp(-(dx * dx + dy * dy) / r2);
    const [fx, fy] = force(dx, dy, g), i = y * WIND_W + x;
    windVX[i] += fx;
    windVY[i] += fy;
  }
}

function updateWind(dt) {
  if (pointer.moved && dt > 0) {
    const vx = (pointer.x - pointer.px) / dt, vy = (pointer.y - pointer.py) / dt; // screen widths per second
    const speed = Math.hypot(vx, vy);
    if (speed > 0.02) {
      const k = Math.min(speed, 4) / speed * 0.25;
      splat(pointer.x, pointer.y, 0.07 + Math.min(speed, 3) * 0.02, (dx, dy, g) => [vx * k * g, vy * k * g]);
    }
  }
  pointer.moved = false;
  pointer.px = pointer.x;
  pointer.py = pointer.y;
  // spread to neighbours and fade
  const decay = Math.exp(-dt * 1.4);
  for (let y = 0; y < WIND_H; y++) for (let x = 0; x < WIND_W; x++) {
    const i = y * WIND_W + x;
    const l = x > 0 ? i - 1 : i, r = x < WIND_W - 1 ? i + 1 : i, d = y > 0 ? i - WIND_W : i, u = y < WIND_H - 1 ? i + WIND_W : i;
    windTmpX[i] = (windVX[i] * 0.6 + (windVX[l] + windVX[r] + windVX[d] + windVX[u]) * 0.1) * decay;
    windTmpY[i] = (windVY[i] * 0.6 + (windVY[l] + windVY[r] + windVY[d] + windVY[u]) * 0.1) * decay;
  }
  for (let i = 0; i < windVX.length; i++) {
    windVX[i] = THREE.MathUtils.clamp(windTmpX[i], -1.5, 1.5);
    windVY[i] = THREE.MathUtils.clamp(windTmpY[i], -1.5, 1.5);
    windData[i * 4] = 128 + THREE.MathUtils.clamp(windVX[i], -1, 1) * 127;
    windData[i * 4 + 1] = 128 + THREE.MathUtils.clamp(windVY[i], -1, 1) * 127;
    windData[i * 4 + 3] = 255;
  }
  windTex.needsUpdate = true;
}

// wind at a screen position (0..1, origin bottom-left), bilinear
function windAt(u, v, out = new THREE.Vector2()) {
  const fx = THREE.MathUtils.clamp(u * WIND_W - 0.5, 0, WIND_W - 1.001), fy = THREE.MathUtils.clamp(v * WIND_H - 0.5, 0, WIND_H - 1.001);
  const x = Math.floor(fx), y = Math.floor(fy), tx = fx - x, ty = fy - y, i = y * WIND_W + x;
  const lerp2 = a => (a[i] * (1 - tx) + a[i + 1] * tx) * (1 - ty) + (a[i + WIND_W] * (1 - tx) + a[i + WIND_W + 1] * tx) * ty;
  return out.set(lerp2(windVX), lerp2(windVY));
}
const _wp = new THREE.Vector3();
function windAtWorld(p, out = new THREE.Vector2()) {
  _wp.copy(p).project(camera);
  if (_wp.z > 1) return out.set(0, 0);
  return windAt(_wp.x * 0.5 + 0.5, _wp.y * 0.5 + 0.5, out);
}
// screen-space wind -> world-space push, using the camera's right and up
const camRight = new THREE.Vector3(), camUp = new THREE.Vector3();
function windToWorld(w, out = new THREE.Vector3()) {
  camRight.setFromMatrixColumn(camera.matrixWorld, 0);
  camUp.setFromMatrixColumn(camera.matrixWorld, 1);
  return out.copy(camRight).multiplyScalar(w.x).addScaledVector(camUp, w.y);
}

// ================= Material look =================
// Every lit material goes through one shader hook, configured per material in material.userData.look:
//   rim     warm rim light on silhouettes, strongest when the sun is behind them (the backlit glow in the references)
//   transl  sunlight glowing through thin things: leaves, grass, canvas
//   sunVis  baked sun visibility (long shadows across the far terrain), multiplies the direct sunlight only
//   wind    mouse wind + idle sway
// Strengths are per-material uniforms; only the on/off flags change the program, so materials share programs.
const lookShared = { rimColor: { value: col('#efc58e') }, translColor: { value: col('#d2d98c') } };

const WIND_VERTEX = /* glsl */`
  {
    float flexW = clamp(position.y, 0.0, 1.0);
    vec2 w = windAtClip(gl_Position);
    #ifdef USE_INSTANCING
      vec3 anchor = instanceMatrix[3].xyz;
    #else
      vec3 anchor = position;
    #endif
    float ph = dot(anchor, vec3(0.37, 0.11, 0.53));
    vec2 idle = vec2(sin(windTime * 1.3 + ph) + 0.5 * sin(windTime * 2.9 + ph * 1.7), 0.4 * sin(windTime * 1.7 + ph * 0.7)) * windIdle;
    float shiver = sin(windTime * 18.0 + ph * 5.0) * min(length(w), 1.0) * 0.25; // tips flutter in a gust
    vec2 disp = (w * windAmount + idle) * (0.3 + 0.7 * flexW) + vec2(shiver, -0.5 * shiver) * windAmount * flexW;
    mvPosition.xy += disp;
    gl_Position = projectionMatrix * mvPosition;
  }`;

const lookFragment = transl => /* glsl */`
  #ifdef USE_FOG
  {
    vec3 lookV = normalize(vFogWorld - cameraPosition);        // camera -> surface
    float backlit = max(dot(lookV, fogSunDir), 0.0);            // 1 when the sun is right behind the surface
    float NdotV = clamp(dot(normal, normalize(vViewPosition)), 0.0, 1.0);
    float rim = pow(1.0 - NdotV, 3.0);
    totalEmissiveRadiance += rimColor * rimStrength * rim * (0.12 + 0.88 * backlit * backlit) * (0.4 + diffuseColor.rgb);
    ${transl ? 'totalEmissiveRadiance += diffuseColor.rgb * translColor * translStrength * 0.04;' : ''}
  }
  #endif`;

function setLook(mat, look = {}) {
  const l = mat.userData.look = { rim: 0.2, transl: 0, sunVis: false, wind: null, ...mat.userData.look, ...look };
  mat.userData.lookUniforms = {
    rimStrength: { value: l.rim }, translStrength: { value: l.transl },
    windAmount: { value: l.wind ? l.wind.amount : 0 }, windIdle: { value: l.wind ? l.wind.idle : 0 },
  };
  mat.onBeforeCompile = lookHook;
  mat.customProgramCacheKey = () => `look:${l.transl > 0 ? 1 : 0}${l.sunVis ? 1 : 0}${l.wind ? 1 : 0}`;
  mat.needsUpdate = true;
  return mat;
}

function lookHook(shader) {
  const l = this.userData.look;
  Object.assign(shader.uniforms, mistUniforms, lookShared, this.userData.lookUniforms, windUniforms, { windTime: skyUniforms.time });
  let vPars = 'uniform float windTime, windAmount, windIdle;\n';
  if (l.sunVis) vPars += 'attribute float sunVis;\nvarying float vSunVis;\n';
  if (l.wind) vPars += WIND_GLSL;
  shader.vertexShader = shader.vertexShader.replace('#include <common>', '#include <common>\n' + vPars);
  if (l.sunVis) shader.vertexShader = shader.vertexShader.replace('#include <begin_vertex>', '#include <begin_vertex>\nvSunVis = sunVis;');
  if (l.wind) shader.vertexShader = shader.vertexShader.replace('#include <project_vertex>', '#include <project_vertex>\n' + WIND_VERTEX);

  let fPars = 'uniform vec3 rimColor, translColor, keyDirW, dappleCenter;\nuniform float rimStrength, translStrength, windTime;\n' + DAPPLE_GLSL;
  if (l.sunVis) fPars += 'varying float vSunVis;\n';
  shader.fragmentShader = shader.fragmentShader.replace('#include <common>', '#include <common>\n' + fPars);
  if (l.sunVis) shader.fragmentShader = shader.fragmentShader.replace('#include <lights_pars_begin>',
    THREE.ShaderChunk.lights_pars_begin.replace('light.color = directionalLight.color;', 'light.color = directionalLight.color * vSunVis;'));
  shader.fragmentShader = shader.fragmentShader.replace('#include <emissivemap_fragment>', '#include <emissivemap_fragment>\n' + lookFragment(l.transl > 0));
  shader.fragmentShader = shader.fragmentShader.replace('#include <lights_fragment_begin>', lookLights(l.transl > 0));
}

// Two additions inside the directional-light loop, after the shadow test:
//  - dappled light: around the camp the sunlight breaks into soft patches, as if through the leaves overhead (the bear
//    and archer references). The pattern is projected along the light, drifts slowly and shifts with the wind.
//  - translucency: sunlight shining through thin things, only where the sun actually reaches them.
const DAPPLE_GLSL = /* glsl */`
  float dHash(vec2 p) { return fract(sin(dot(p, vec2(41.7, 289.3))) * 43758.5453); }
  float dNoise(vec2 p) {
    vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
    return mix(mix(dHash(i), dHash(i + vec2(1, 0)), f.x), mix(dHash(i + vec2(0, 1)), dHash(i + vec2(1, 1)), f.x), f.y);
  }
`;
const lookLights = (() => {
  const cache = {};
  return transl => {
    if (cache[transl]) return cache[transl];
    const chunk = THREE.ShaderChunk.lights_fragment_begin;
    const dirStart = chunk.indexOf('#if ( NUM_DIR_LIGHTS > 0 ) && defined( RE_Direct )');
    const call = /RE_Direct\(\s*directLight[^;]*;/g;
    call.lastIndex = dirStart;
    const m = call.exec(chunk);
    if (dirStart < 0 || !m) { console.warn('look: lights chunk not recognised'); return (cache[transl] = chunk); }
    const dapple = `
      #ifdef USE_FOG
      {
        vec3 wp = vFogWorld;
        float zone = 1.0 - smoothstep(13.0, 24.0, length(wp - dappleCenter));
        if (zone > 0.0) {
        vec2 g = wp.xz - keyDirW.xz * (wp.y - 56.0) / keyDirW.y;     // follow the light down to the ledge plane
        float n = dNoise(g * 0.55 + vec2(windTime * 0.05, windTime * 0.03)) * 0.6 + dNoise(g * 1.4 - windTime * 0.07) * 0.4;
        float lit = smoothstep(0.4, 0.6, n);
        directLight.color *= mix(1.0, 0.18 + 0.82 * lit, zone * 0.7);
        }
      }
      #endif
    `;
    const through = transl ? `
      {
        float through = pow(clamp(dot(-geometryViewDir, directLight.direction), 0.0, 1.0), 3.0);
        float back = clamp(-dot(geometryNormal, directLight.direction), 0.0, 1.0);
        reflectedLight.directDiffuse += material.diffuseColor * directLight.color * translColor * translStrength * (0.25 * back + 1.4 * through);
      }` : '';
    return (cache[transl] = chunk.slice(0, m.index) + dapple + m[0] + through + chunk.slice(m.index + m[0].length));
  };
})();

// wind + idle sway (keeps whatever else the material's look already has)
const windify = (mat, { amount = 0.3, idle = 0.03 } = {}) => setLook(mat, { wind: { amount, idle } });

const sunDir = new THREE.Vector3();
mistUniforms.fogSunDir.value = sunDir;
const SUN_AZIMUTH = THREE.MathUtils.degToRad(23); // right of centre, like the reference

// ================= Shared sky function (used by the sky dome and by water reflections) =================
const skyUniforms = {
  sunDir: { value: sunDir },
  time: { value: 0 },
  cZenith: { value: col(PALETTE.zenith) },
  cMid: { value: col(PALETTE.mid) },
  cHorizon: { value: col(PALETTE.horizon) },
  cGround: { value: col(PALETTE.ground) },
  cGlow: { value: col(PALETTE.glow) },
  cCloudLit: { value: col(PALETTE.cloudLit) },
  cCloudShade: { value: col(PALETTE.cloudShade) },
};

const SKY_GLSL = /* glsl */`
  uniform vec3 sunDir, cZenith, cMid, cHorizon, cGround, cGlow, cCloudLit, cCloudShade;
  uniform float time;

  float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
  float vnoise(vec2 p) {
    vec2 i = floor(p), f = fract(p);
    f = f * f * (3.0 - 2.0 * f);
    return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), f.x), f.y);
  }
  float fbm(vec2 p) {
    float s = 0.0, a = 0.5;
    for (int i = 0; i < 5; i++) { s += a * vnoise(p); p = p * 2.03 + vec2(1.7, 9.2); a *= 0.5; }
    return s;
  }

  vec3 skyColor(vec3 d) {
    float h = d.y;
    float cosA = dot(d, sunDir);
    float sunAmt = max(cosA, 0.0);

    // vertical gradient
    vec3 c = mix(cHorizon, cMid, smoothstep(0.0, 0.07, h));
    c = mix(c, cZenith, smoothstep(0.04, 0.3, h));   // blue sky reaches down into the frame
    c = mix(c, cGround, smoothstep(0.0, -0.08, h));
    // the half of the sky facing away from the sun is a touch cooler and greener
    float awayFromSun = 1.0 - max(dot(normalize(d.xz + 1e-5), normalize(sunDir.xz)), 0.0);
    c = mix(c, c * vec3(0.78, 0.9, 1.06), awayFromSun * 0.75);

    // sun halo: wide wash + tighter glow + hot core
    c += cGlow * (pow(sunAmt, 6.0) * 0.12 + pow(sunAmt, 40.0) * 0.45 + pow(sunAmt, 1200.0) * 0.8);
    // bright band hugging the horizon on the sun's side
    float azim = max(dot(normalize(d.xz + 1e-5), normalize(sunDir.xz)), 0.0);
    c += cGlow * pow(azim, 8.0) * exp(-abs(h - sunDir.y) * 10.0) * 0.18;

    // sun disc (HDR so it blooms)
    c = mix(c, cGlow * 9.0, smoothstep(0.99935, 0.99945, cosA)); // a larger, clearly round sun

    // clouds: wispy horizontal streaks that drift slowly, lit from the sun side
    if (h > 0.0) {
      vec2 uv = d.xz / (h + 0.12) * vec2(0.45, 1.4) + vec2(time * 0.006, 0.0);
      float n = fbm(uv * 1.2);
      float n2 = fbm(uv * 3.1 + n * 1.6 - vec2(time * 0.004, 0.0));
      float dens = smoothstep(0.46, 0.76, n * 0.7 + n2 * 0.45);
      dens *= smoothstep(0.02, 0.09, h) * (1.0 - smoothstep(0.22, 0.55, h));
      dens *= 1.0 - 0.85 * pow(sunAmt, 300.0); // sun burns through the clouds
      vec3 cc = mix(cCloudShade, cCloudLit, pow(sunAmt, 3.0));
      cc += cGlow * pow(sunAmt, 18.0) * (1.0 - dens) * 1.6; // silver lining near the sun
      c = mix(c, cc, dens * 0.9);
    }
    return c;
  }
`;

// ================= Sky dome =================
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  depthWrite: false,
  uniforms: skyUniforms,
  vertexShader: /* glsl */`
    varying vec3 vDir;
    void main() {
      vDir = position;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }`,
  fragmentShader: SKY_GLSL + /* glsl */`
    varying vec3 vDir;
    void main() { gl_FragColor = vec4(skyColor(normalize(vDir)), 1.0); }`,
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(3000, 64, 32), skyMat);
sky.renderOrder = -1;
scene.add(sky);

// ================= Lighting =================
// The visible sun sits low over the ridge. The key light comes from the same side but higher, the way a painter cheats it:
// that gives readable rim light, lit tops and shadows that fall across the ledge towards the camera.
const keyDir = new THREE.Vector3();
const FOCUS = new THREE.Vector3(-2, 56, -18); // the camp: where the high-resolution shadows are centred
const sunLight = new THREE.DirectionalLight(col(PALETTE.sunLow), 4.0);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(2048, 2048);
sunLight.shadow.bias = -0.0003;
sunLight.shadow.normalBias = 0.035;
Object.assign(sunLight.shadow.camera, { left: -22, right: 22, top: 22, bottom: -22, near: 1, far: 170 });
sunLight.target.position.copy(FOCUS);
scene.add(sunLight, sunLight.target);
lookShared.keyDirW = { value: keyDir };
lookShared.dappleCenter = { value: FOCUS };

const fill = new THREE.HemisphereLight(col(PALETTE.skyFill), col(PALETTE.groundFill), 1.0); // enough sky light that shadows keep their form
scene.add(fill);

function setSun(elevDeg) {
  const el = THREE.MathUtils.degToRad(elevDeg);
  sunDir.set(Math.sin(SUN_AZIMUTH) * Math.cos(el), Math.sin(el), -Math.cos(SUN_AZIMUTH) * Math.cos(el)).normalize();
  const kel = THREE.MathUtils.degToRad(Math.max(elevDeg + 20, 26));
  keyDir.set(Math.sin(SUN_AZIMUTH) * Math.cos(kel), Math.sin(kel), -Math.cos(SUN_AZIMUTH) * Math.cos(kel)).normalize();
  sunLight.position.copy(FOCUS).addScaledVector(keyDir, 80);
  sunLight.shadow.camera.updateProjectionMatrix();
  const t = THREE.MathUtils.clamp((elevDeg - 1) / 19, 0, 1);
  sunLight.color.copy(col(PALETTE.sunLow)).lerp(col(PALETTE.sunHigh), t);
  markShadowsDirty();
}
setSun(6);

// ================= Noise helpers =================
function mulberry32(a) {
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function makeNoise(rand) {
  const perm = [...Array(256).keys()];
  for (let i = 255; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [perm[i], perm[j]] = [perm[j], perm[i]]; }
  const p = new Uint8Array(512); for (let i = 0; i < 512; i++) p[i] = perm[i & 255];
  const fade = t => t * t * t * (t * (t * 6 - 15) + 10), lerp = (a, b, t) => a + t * (b - a);
  const grad = (h, x, y, z) => { h &= 15; const u = h < 8 ? x : y, v = h < 4 ? y : (h === 12 || h === 14 ? x : z);
    return ((h & 1) ? -u : u) + ((h & 2) ? -v : v); };
  return (x, y, z) => {
    const X = Math.floor(x) & 255, Y = Math.floor(y) & 255, Z = Math.floor(z) & 255;
    x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);
    const u = fade(x), v = fade(y), w = fade(z);
    const A = p[X] + Y, AA = p[A] + Z, AB = p[A + 1] + Z, B = p[X + 1] + Y, BA = p[B] + Z, BB = p[B + 1] + Z;
    return lerp(lerp(lerp(grad(p[AA], x, y, z), grad(p[BA], x - 1, y, z), u), lerp(grad(p[AB], x, y - 1, z), grad(p[BB], x - 1, y - 1, z), u), v),
      lerp(lerp(grad(p[AA + 1], x, y, z - 1), grad(p[BA + 1], x - 1, y, z - 1), u), lerp(grad(p[AB + 1], x, y - 1, z - 1), grad(p[BB + 1], x - 1, y - 1, z - 1), u), v), w);
  };
}
function fbm(noise, x, y, z, oct) { let s = 0, a = 0.5, f = 1; for (let i = 0; i < oct; i++) { s += a * noise(x * f, y * f, z * f); a *= 0.5; f *= 2; } return s; }
function ridged(noise, x, z, oct) { let s = 0, a = 0.5, f = 1; for (let i = 0; i < oct; i++) { let r = 1 - Math.abs(noise(x * f, 0.5, z * f)); s += a * r * r; a *= 0.5; f *= 2.1; } return s; }

const nHills = makeNoise(mulberry32(11));
const nMount = makeNoise(mulberry32(29));
const nTrees = makeNoise(mulberry32(47));

// ================= World height function =================
// d = distance from camera (-z). x = left/right. Water level is y = 0.
const PEAKS = [ // big shapes so the composition is designed, noise adds the detail
  { x: -40,  d: 1000, h: 275, r: 300 }, // hero peak, centred behind the pillars, snow-capped
  { x: -330, d: 860, h: 130, r: 230 },
  { x: -700, d: 900, h: 150, r: 270 },
  { x: -170, d: 760, h: 80,  r: 170 },
  { x: 170,  d: 960, h: 120, r: 220 },
  { x: 330,  d: 690, h: 70,  r: 160 },  // low hills by the lake
  { x: 600,  d: 990, h: 105, r: 240 },  // low range under the sun so it can sit just above
  { x: 880,  d: 900, h: 175, r: 260 },
];

function riverCenter(d) { return 50 + 0.33 * (d - 80) + 25 * Math.sin(d * 0.011); }
function riverWidth(d) {
  return 14 + 0.1 * (d - 80)
    + 35 * smooth(330, 420, d) * (1 - smooth(560, 640, d))   // mid widening for the islands
    + 230 * smooth(600, 800, d) * (1 - smooth(1000, 1150, d)); // the lake
}

// Forested islands in the river: offset from the river centre, distance, radius
const ISLANDS = [
  { o: 6, d: 445, r: 13 }, { o: -14, d: 525, r: 18 }, { o: 42, d: 650, r: 28 },
  { o: -55, d: 770, r: 34 }, { o: 70, d: 890, r: 40 },
];
function islandHeight(x, d) {
  let h = -Infinity;
  for (const isl of ISLANDS) {
    const dx = x - (riverCenter(isl.d) + isl.o), dd = d - isl.d;
    const warp = 0.25 * isl.r * nHills(x * 0.05, 3.3, d * 0.05);
    const t = (Math.sqrt(dx * dx + dd * dd * 0.6) + warp) / isl.r;
    h = Math.max(h, 9 * (1 - t * t) - 1.5);
  }
  return h;
}

function lakeMask(x, d) {
  const w = riverWidth(d);
  return 1 - smooth(w * 0.7, w, Math.abs(x - riverCenter(d)));
}

function heightAt(x, z) {
  const d = -z;
  // rolling forested valley floor
  let h = 6 + 16 * fbm(nHills, x * 0.005, 0.3, z * 0.005, 4) + 7 * ridged(nHills, x * 0.012, z * 0.012, 3);
  h = Math.max(h, 1.5);

  // mountains rising with distance
  const rise = smooth(520, 800, d);
  let m = 0;
  for (const p of PEAKS) {
    const dx = x - p.x, dd = d - p.d;
    const warp = 70 * fbm(nMount, x * 0.006, 2.2, d * 0.006, 3); // irregular footprint, not a perfect cone
    const t = (Math.sqrt(dx * dx + dd * dd * 1.6) + warp) / p.r;
    if (t < 1) m = Math.max(m, p.h * Math.pow(1 - t, 1.25));
  }
  m = Math.max(m, rise * (55 + 45 * fbm(nMount, x * 0.004, 1.3, 0, 3)));
  m *= 0.5 + 0.95 * ridged(nMount, x * 0.011, d * 0.011, 5); // ridges and gullies
  m *= 1 - smooth(1150, 1300, d);                             // hide the far mesh edge

  const lake = lakeMask(x, d);
  h += m * (1 - 0.95 * lake);
  return Math.max(THREE.MathUtils.lerp(h, -6, lake), islandHeight(x, d));
}

// ================= Rock masses: cliffs and spires, built like the approved rock but at landscape scale =================
const ROCK_MASSES = []; // footprints, so trees are not planted inside rock

function buildRockMass({ seed, center, size, detail = 64, column = 0, shadows = true, rough = 0, tint = 1, cuts = 9, cutDepth = 0.62, tilt = null }) {
  const rand = mulberry32(seed), noise = makeNoise(rand);
  let geo = new THREE.IcosahedronGeometry(1, detail);
  geo.deleteAttribute('uv'); geo.deleteAttribute('normal');
  geo = mergeVertices(geo);

  const planes = [];
  for (let i = 0; i < cuts; i++) planes.push({ n: new THREE.Vector3(rand() * 2 - 1, rand() * 1.2 - 0.2, rand() * 2 - 1).normalize(), d: cutDepth + rand() * 0.25 }); // fracture faces
  const half = size.clone().multiplyScalar(0.5);
  const k = THREE.MathUtils.clamp(Math.min(half.x, half.z) / 60, 0.06, 1.5); // detail scale: foreground boulders vs spires vs wide cliffs
  const off = rand() * 100;

  const pos = geo.attributes.position;
  const v = new THREE.Vector3(), dir = new THREE.Vector3(), hd = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    dir.fromBufferAttribute(pos, i).normalize();
    // 1. lumpy unit form + chisel cuts (same recipe as the rock)
    v.copy(dir).multiplyScalar(1 + 0.22 * fbm(noise, dir.x * 1.3 + off, dir.y * 1.3, dir.z * 1.3, 3));
    for (const { n, d } of planes) { const c = v.dot(n) - d; if (c > 0) v.addScaledVector(n, -c * 0.95); }
    if (rough) v.addScaledVector(dir, rough * fbm(noise, dir.x * 4 + off, dir.y * 4, dir.z * 4, 4)); // facets and knobs on small rocks
    // 1b. pillars: push the sides out into a straight column with a flat, slightly broken top
    if (column > 0) {
      const r = Math.hypot(v.x, v.z);
      const s = THREE.MathUtils.lerp(1, 0.85 / Math.max(r, 0.25), column * smooth(0.98, 0.7, Math.abs(dir.y)));
      v.x *= s; v.z *= s;
      v.y = Math.min(v.y, 0.82 + 0.06 * noise(dir.x * 4 + off, 0.5, dir.z * 4));
    }
    // 2. scale to landscape size
    v.multiply(half);
    hd.set(dir.x, 0, dir.z).normalize();
    // 3. vertical fluting (rain erosion) and horizontal ledges (rock layers)
    v.addScaledVector(hd, 6 * k * fbm(noise, v.x * 0.06 + off, v.y * 0.012, v.z * 0.06, 4));
    const layer = v.y * 0.12 + 1.5 * noise(v.x * 0.02, off, v.z * 0.02);
    v.addScaledVector(hd, 2.2 * k * smooth(0.7, 1, layer - Math.floor(layer)));
    // 4. surface bumps
    v.addScaledVector(dir, 2 * k * fbm(noise, v.x * 0.15, v.y * 0.15 + off, v.z * 0.15, 3));
    pos.setXYZ(i, v.x, v.y, v.z);
  }
  geo.computeVertexNormals();

  const nrm = geo.attributes.normal, colors = new Float32Array(pos.count * 3);
  const stones = pal('#6b6762', '#76695a', '#626468', '#7e7466', '#585855', '#857b6d');
  const mosses = pal('#3f6a2c', '#4f7a30', '#5f8a34', '#365a2c', '#6a8a3a');
  const lichens = pal('#d8c98a', '#c9b26a', '#a8b878');
  const c = new THREE.Color(), f = new THREE.Color(), lc = new THREE.Color();
  const cf = 0.35 / Math.max(k, 0.35); // finer colour variation on small foreground rocks
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i) * cf, y = pos.getY(i) * cf, z = pos.getZ(i) * cf;
    const rv = 0.5 + fbm(noise, x * 0.03 + 40, y * 0.03, z * 0.03, 4);
    varied(stones, 0.5 + 0.9 * noise(x * 0.012 + 7, y * 0.012, z * 0.012), rv, c);       // patches of different stone
    c.multiplyScalar(0.8 + 0.4 * THREE.MathUtils.clamp(rv, 0, 1));
    c.multiplyScalar(0.75 + 0.3 * (0.5 + noise(x * 0.08, y * 0.008, z * 0.08)));          // dark vertical water stains
    const sp = noise(x * 0.6 + 3, y * 0.6, z * 0.6);                                       // lichen speckles
    if (sp > 0.3) c.lerp(varied(lichens, (sp * 7) % 1, 0.5, lc), smooth(0.3, 0.5, sp) * 0.45);
    varied(mosses, 0.5 + noise(x * 0.04, 2.2, z * 0.04), 0.5 + noise(x * 0.1, y * 0.1, z * 0.1), f);
    c.lerp(f, smooth(0.55, 0.8, nrm.getY(i) + 0.2 * noise(x * 0.05, 5.5, z * 0.05)));     // green on flat tops and ledges
    c.multiplyScalar(0.55 + 0.45 * smooth(-half.y, half.y * 0.2, pos.getY(i)));             // darker towards the base
    c.multiplyScalar(tint);
    colors.set([c.r, c.g, c.b], i * 3);
  }
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

  const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.95 }));
  mesh.position.copy(center);
  if (tilt) mesh.rotation.set(...tilt);
  mesh.castShadow = mesh.receiveShadow = shadows;
  scene.add(mesh);
  ROCK_MASSES.push({ x: center.x, z: center.z, rx: half.x * 0.9, rz: half.z * 0.9 });
  return mesh;
}

function insideRock(x, z) {
  return ROCK_MASSES.some(r => ((x - r.x) / r.rx) ** 2 + ((z - r.z) / r.rz) ** 2 < 1);
}

// Spots on the flat tops of a rock mass, for planting trees
function topSpots(mesh, count, rand) {
  const pos = mesh.geometry.attributes.position, nrm = mesh.geometry.attributes.normal;
  let minY = Infinity, maxY = -Infinity;
  for (let i = 0; i < pos.count; i++) { const y = pos.getY(i); minY = Math.min(minY, y); maxY = Math.max(maxY, y); }
  const band = (maxY - minY) * 0.12, cands = [];
  for (let i = 0; i < pos.count; i++) if (nrm.getY(i) > 0.72 && pos.getY(i) > maxY - band) cands.push(i);
  const spots = [];
  for (let j = 0; j < count && cands.length; j++) {
    const i = cands[Math.floor(rand() * cands.length)];
    spots.push(new THREE.Vector3(pos.getX(i), pos.getY(i), pos.getZ(i)).add(mesh.position));
  }
  return spots;
}

// ================= Terrain meshes =================
function buildTerrain(zNear, zFar, width, segX, segZ) {
  const depth = zNear - zFar;
  const geo = new THREE.PlaneGeometry(width, depth, segX, segZ);
  geo.rotateX(-Math.PI / 2);
  geo.translate(0, 0, (zNear + zFar) / 2);
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) pos.setY(i, heightAt(pos.getX(i), pos.getZ(i)));
  geo.computeVertexNormals();

  // colour: forest on gentle low slopes, rock on steep or high ground, mud at the shore
  const nrm = geo.attributes.normal, colors = new Float32Array(pos.count * 3);
  const stones = pal('#6f6d68', '#666a6c', '#7c7468', '#8a8478', '#5f5f5c');
  const forests = pal('#22402c', '#2a4a30', '#33552f', '#1f3a30', '#3d5c2e', '#4a5a2a');
  const meadows = pal('#6a8a34', '#7f9a3a', '#9aa346', '#8a8a3a');
  const mud = col(PALETTE.mud), snowCol = new THREE.Color(1.25, 1.2, 1.17); // brighter than white so backlit snow still reads against the sky
  const c = new THREE.Color(), f = new THREE.Color(), g = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    const steep = 1 - nrm.getY(i);
    const v = 0.5 + fbm(nMount, x * 0.02, 4.1, z * 0.02, 3);
    varied(stones, 0.5 + 0.8 * nMount(x * 0.006 + 3, 1.1, z * 0.006), v, c);
    const treeline = 95 + 30 * nMount(x * 0.01, 7.7, z * 0.01);
    const forestAmt = smooth(0.42, 0.2, steep) * smooth(treeline, treeline - 25, y);
    varied(forests, 0.5 + 0.9 * nHills(x * 0.01, 6.6, z * 0.01), v * 0.8, f);
    c.lerp(f, forestAmt);
    // open meadow clearings where the tree clumps thin out
    const mead = smooth(0.0, -0.25, nTrees(x * 0.018, 0.5, z * 0.018)) * forestAmt * smooth(0.25, 0.1, steep);
    c.lerp(varied(meadows, 0.5 + nHills(x * 0.02, 9.9, z * 0.02), v, g), mead * 0.7);
    c.lerp(mud, smooth(3, 0.5, y));
    // snow on the high, gentler ground; bare rock where it is too steep to hold
    const snowline = 122 + 22 * nMount(x * 0.008, 3.3, z * 0.008);
    c.lerp(snowCol, smooth(snowline, snowline + 25, y) * smooth(0.88, 0.5, steep) * (0.75 + 0.25 * nMount(x * 0.05, 1.7, z * 0.05)));
    colors.set([c.r, c.g, c.b], i * 3);
  }
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  geo.setAttribute('sunVis', new THREE.BufferAttribute(new Float32Array(pos.count).fill(1), 1)); // baked later
  const mesh = new THREE.Mesh(geo, setLook(new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1 }), { sunVis: true, rim: 0.1 }));
  scene.add(mesh);
  return mesh;
}

// ================= Water: reflects the same sky, with sun glitter. Used for the river/lake and the foreground pool =================
function makeWaterMat({ foamPos = new THREE.Vector3(), foamAmt = 0, waveScale = 1 } = {}) {
  return new THREE.ShaderMaterial({
    fog: true,
    uniforms: { ...THREE.UniformsUtils.clone(THREE.UniformsLib.fog), ...skyUniforms, ...mistUniforms,
      cDeep: { value: col(PALETTE.water) }, foamPos: { value: foamPos }, foamAmt: { value: foamAmt }, waveScale: { value: waveScale }, ...windUniforms },
    vertexShader: /* glsl */`
      #include <fog_pars_vertex>
      varying vec3 vWorld;
      void main() {
        vWorld = (modelMatrix * vec4(position, 1.0)).xyz;
        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
        gl_Position = projectionMatrix * mvPosition;
        #include <fog_vertex>
      }`,
    fragmentShader: SKY_GLSL + /* glsl */`
      #include <fog_pars_fragment>
      uniform vec3 cDeep, foamPos;
      uniform float foamAmt, waveScale;
      uniform vec2 resolution;
      ${WIND_GLSL}
      varying vec3 vWorld;
      float waves(vec2 p) {
        float t = time;
        p *= waveScale;
        return fbm(p * 0.05 + vec2(t * 0.02, t * 0.012)) + 0.5 * fbm(p * 0.21 - vec2(t * 0.05, -t * 0.03));
      }
      void main() {
        vec3 V = normalize(vWorld - cameraPosition);
        vec2 p = vWorld.xz;
        float e = 0.6, w0 = waves(p);
        vec3 N = normalize(vec3(-(waves(p + vec2(e, 0.0)) - w0) * 1.6, 1.0, -(waves(p + vec2(0.0, e)) - w0) * 1.6));

        // splash zone where a waterfall lands: rings spreading out + churned white foam
        vec2 fp = p - foamPos.xz;
        float fdist = length(fp);
        float ring = sin(fdist * 5.0 - time * 5.0) * smoothstep(6.0, 0.4, fdist) * foamAmt;
        N = normalize(N + vec3(fp.x, 0.0, fp.y) / max(fdist, 0.05) * ring * 0.12);

        // a gust passing over the water: the surface tilts with it and breaks into fine chop
        vec2 gw = windAtUv(gl_FragCoord.xy / resolution);
        float gust = clamp(length(gw), 0.0, 1.0);
        float chop = fbm(p * 0.35 * waveScale + vec2(time * 1.7, -time * 1.3)) - 0.5;
        N = normalize(N + vec3(gw.x, 0.0, -gw.y) * 0.18 + vec3(chop, 0.0, -chop) * gust * 0.9);

        vec3 R = reflect(V, N);
        R.y = abs(R.y);
        float fres = 0.05 + 0.95 * pow(1.0 - max(dot(-V, N), 0.0), 5.0);
        vec3 c = mix(cDeep, skyColor(R) * vec3(0.9, 0.97, 1.07) * mix(0.7, 1.0, foamAmt < 0.5 ? 1.0 : 0.0), clamp(fres * 0.9 + mix(0.06, 0.18, step(foamAmt, 0.5)), 0.0, 1.0));
        c += cGlow * pow(max(dot(R, sunDir), 0.0), 700.0) * 25.0; // glitter path under the sun

        // current: long streaks drifting downstream in the river, fading out on the calm lake
        vec2 fd = normalize(vec2(0.33, -1.0));
        vec2 q = vec2(dot(p, fd), dot(p, vec2(-fd.y, fd.x)));
        float streak = fbm(q * vec2(0.03, 0.25) - vec2(time * 0.4, 0.0));
        float riverZone = (1.0 - smoothstep(450.0, 700.0, -vWorld.z)) * (1.0 - foamAmt);
        c *= 1.0 + (streak - 0.5) * 0.45 * riverZone;

        float foam = foamAmt * smoothstep(2.4, 0.2, fdist + (fbm(p * 2.2 + vec2(time * 0.9, -time * 0.6)) - 0.5) * 1.8);
        c = mix(c, vec3(1.0, 0.96, 0.86) * 1.1, foam * 0.85);
        gl_FragColor = vec4(c, 1.0);
        #include <fog_fragment>
      }`,
  });
}

function buildForest() {

  const treePal = pal('#1d3a2c', '#24432f', '#2d4f32', '#365a34', '#1d3530', '#3f5f30', '#4f5a2a'), c = new THREE.Color();
  let n = 0;
  for (let tries = 0; tries < 120000 && n < MAX; tries++) {

    if (insideRock(x, z)) continue;

    const slope = Math.abs(heightAt(x + 3, z) - y) + Math.abs(heightAt(x, z - 3) - y);
    if (slope > 3.2) continue;                                           // no trees on cliffs
    if (nTrees(x * 0.009, 0.5, z * 0.009) + rand() * 0.18 < 0.1) continue;  // fewer, larger forest masses with clear gaps
    const hgt = 5 + Math.pow(rand(), 0.7) * 10;  // varied heights

    m.compose(p, q, s);

  trees.count = n;
  trees.userData.bake = true;

// ================= Midground pines: tiered trees with trunks, on the valley floor and on rock tops =================
// A pine built from drooping, ragged branch tiers: each tier is a cone whose rim is pushed in and out (branch tips),
// dropped at the tips and turned at random, so the silhouette reads as needles rather than a cone.
function makePineGeometry(tiers = 5, radial = 10, seed = 3, trunk = true) {
  const rand = mulberry32(seed);
  const parts = [];
  const inner = col('#7a8a74'), tip = col('#ffffff'), c = new THREE.Color();
  if (trunk) {
    const stem = new THREE.CylinderGeometry(0.03, 0.05, 0.4, 5, 1, true).translate(0, 0.2, 0);
    stem.setAttribute('color', new THREE.BufferAttribute(new Float32Array(stem.attributes.position.count * 3).fill(0.32), 3));
    parts.push(stem);
  }
  for (let k = 0; k < tiers; k++) {
    const f = k / (tiers - 1);                                   // 0 = bottom tier, 1 = top
    const r = THREE.MathUtils.lerp(0.36, 0.07, Math.pow(f, 0.9));
    const h = THREE.MathUtils.lerp(0.27, 0.2, f);
    const y = THREE.MathUtils.lerp(0.12, 0.8, f);
    const cone = new THREE.ConeGeometry(r, h, radial, 1, true);
    const rot = rand() * Math.PI * 2, lobes = 5 + Math.floor(rand() * 3);
    const pos = cone.attributes.position, colors = new Float32Array(pos.count * 3);
    for (let i = 0; i < pos.count; i++) {
      let x = pos.getX(i), py = pos.getY(i), z = pos.getZ(i);
      const rad = Math.hypot(x, z), out = rad / r;               // 0 at the tier's tip, 1 at its rim
      if (rad > 1e-4) {
        const a = Math.atan2(z, x) + rot;
        const jag = 1 + 0.32 * Math.sin(a * lobes) * out + 0.12 * Math.sin(a * 13 + rot) * out;
        x *= jag; z *= jag;
        py -= 0.12 * h * out * out;                                // branch tips droop
      }
      pos.setXYZ(i, x, py + y + h / 2, z);
      c.copy(inner).lerp(tip, out).multiplyScalar(0.62 + 0.38 * f); // darker inside and lower down
      colors.set([c.r, c.g, c.b], i * 3);
    }
    cone.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    cone.computeVertexNormals();
    parts.push(cone);
  }
  return mergeGeometries(parts);
}

// A broadleaf tree: a few lumpy crowns on a short trunk, coloured per instance (autumn gold, amber, rust, a few still green).
function makeBroadleafGeometry(seed = 9) {
  const noise = makeNoise(mulberry32(seed));
  const trunk = new THREE.CylinderGeometry(0.035, 0.06, 0.55, 6).translate(0, 0.27, 0).toNonIndexed();
  trunk.setAttribute('color', new THREE.BufferAttribute(new Float32Array(trunk.attributes.position.count * 3).fill(0.3), 3));
  const parts = [trunk];
  const blobs = [[0, 0.66, 0, 0.3], [0.18, 0.55, 0.05, 0.22], [-0.17, 0.58, -0.04, 0.22], [0.02, 0.84, 0.02, 0.2], [0.05, 0.52, -0.18, 0.18], [-0.06, 0.5, 0.17, 0.17]];
  for (const [bx, by, bz, br] of blobs) {
    const g = new THREE.IcosahedronGeometry(br, 1);
    const pos = g.attributes.position, colors = new Float32Array(pos.count * 3);
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
      const k = 1 + 0.22 * noise(x * 9 + bx * 5, y * 9, z * 9);    // lumpy crown
      pos.setXYZ(i, x * k + bx, y * k + by, z * k + bz);
      const shade = 0.6 + 0.4 * THREE.MathUtils.clamp((y / br) * 0.5 + 0.5, 0, 1); // lighter on top
      colors.set([shade, shade, shade], i * 3);
    }
    g.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    g.computeVertexNormals();
    parts.push(g);
  }
  return mergeGeometries(parts);
}

// Laid out in screen space on a 16:9 copy of the hero camera, so it lines up with the reference frame.
const layoutCam = camera.clone();
layoutCam.aspect = 16 / 9;
layoutCam.updateProjectionMatrix();
layoutCam.updateMatrixWorld();
function rayAt(sx, sy) {
  return new THREE.Vector3(sx * 2 - 1, 1 - sy * 2, 0.5).unproject(layoutCam).sub(layoutCam.position).normalize();
}
// point at distance d along the screen ray through (sx, sy)   [sx, sy: 0..1 from the top-left]
const atDist = (sx, sy, d) => layoutCam.position.clone().addScaledVector(rayAt(sx, sy), d);
// point where the screen ray through (sx, sy) meets the horizontal plane at height y
function onPlane(sx, sy, y) {
  const r = rayAt(sx, sy);
  return layoutCam.position.clone().addScaledVector(r, (y - layoutCam.position.y) / r.y);
}

// ---------- Tree trunks and branches: tapered tubes with bark ridges, root flare and mossy bases ----------
function buildTrunk(points, r0, r1, seed, { tubular = 48, radial = 14, flare = 0.6 } = {}) {
  const noise = makeNoise(mulberry32(seed));
  const curve = new THREE.CatmullRomCurve3(points);
  const geo = new THREE.TubeGeometry(curve, tubular, 1, radial, false);
  const pos = geo.attributes.position, len = curve.getLength();
  const P = new THREE.Vector3(), v = new THREE.Vector3();
  const colors = new Float32Array(pos.count * 3);
  const dark = col('#2a2019'), light = col('#5e4934'), moss = col('#3f6a2c'), lichen = col('#9a9a7a'), c = new THREE.Color();
  for (let i = 0; i <= tubular; i++) {
    const t = i / tubular;
    curve.getPointAt(t, P);
    const r = THREE.MathUtils.lerp(r0, r1, t) * (1 + flare * Math.pow(smooth(0.12, 0, t), 2));
    for (let j = 0; j <= radial; j++) {
      const k = i * (radial + 1) + j, a = (j / radial) * Math.PI * 2;
      v.fromBufferAttribute(pos, k).sub(P); // unit offset from the centre line
      const bark = noise(Math.cos(a) * 2.2, t * len * 0.25, Math.sin(a) * 2.2);
      const ridge = 1 - Math.abs(noise(Math.cos(a) * 5, t * len * 0.06, Math.sin(a) * 5));
      const rr = r * (1 + 0.07 * bark + 0.06 * ridge);
      pos.setXYZ(k, P.x + v.x * rr, P.y + v.y * rr, P.z + v.z * rr);
      c.copy(dark).lerp(light, THREE.MathUtils.clamp(0.35 + bark * 0.8 + ridge * 0.3, 0, 1));
      c.lerp(moss, smooth(0.25, 0, t) * (0.5 + 0.5 * noise(Math.cos(a) * 3, t * 9, Math.sin(a) * 3)));
      c.lerp(lichen, smooth(0.3, 0.6, noise(Math.cos(a) * 4 + 9, t * len * 0.4, Math.sin(a) * 4)) * 0.5);
      colors.set([c.r, c.g, c.b], k * 3);
    }
  }
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  geo.computeVertexNormals();
  const mesh = new THREE.Mesh(geo, setLook(new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1 }), { rim: 0.5 }));
  mesh.castShadow = mesh.receiveShadow = true;
  scene.add(mesh);
  return curve;
}

// ---------- Leaves: a broad pointed leaf and a fern frond, both bent so they catch light ----------
function makeLeafGeometry() {
  const geo = new THREE.PlaneGeometry(1, 1, 6, 18).translate(0, 0.5, 0);
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i);
    const w = 0.33 * Math.sin(Math.PI * Math.pow(y, 1.25)) * (1 + 0.05 * Math.sin(y * 38)); // narrow stalk end, pointed tip, toothed edge
    pos.setXYZ(i, x * 2 * w, y, -0.22 * y * y + 0.12 * Math.abs(x * 2 * w)); // curl back + fold along the midrib
  }
  geo.computeVertexNormals();
  return geo;
}
// a five-petalled flower facing +z, centre darker than the petals
function makeFlowerGeometry() {
  const geo = new THREE.CircleGeometry(1, 30);
  const pos = geo.attributes.position, colors = new Float32Array(pos.count * 3);
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i), r = Math.hypot(x, y);
    if (r > 1e-4) {
      const k = 0.5 + 0.5 * Math.abs(Math.cos(2.5 * Math.atan2(y, x)));
      pos.setXY(i, x * k, y * k);
    }
    const shade = r < 1e-4 ? 0.55 : 1;
    colors.set([shade, shade * 0.95, shade * 0.85], i * 3);
  }
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  return geo;
}
function makeFrondGeometry() {
  const rows = 48;
  const geo = new THREE.PlaneGeometry(1, 1, 2, rows).translate(0, 0.5, 0);
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {

    const row = Math.round(y * rows);
    const w = 0.24 * Math.pow(Math.sin(Math.PI * y), 0.6) * (row % 2 ? 0.3 : 1); // comb outline = leaflets
    pos.setXYZ(i, x * 2 * w, y, -0.45 * y * y);                                      // arching frond
  }

}

// Orient a leaf so it points along `axis` (base -> tip) and roughly faces `face`
function leafMatrix(m, pos, axis, face, size) {
  const y = axis.clone().normalize();
  const z = face.clone().addScaledVector(y, -face.dot(y)).normalize();
  const x = new THREE.Vector3().crossVectors(y, z);
  return m.makeBasis(x, y, z).scale(new THREE.Vector3(size, size, size)).setPosition(pos);
}

function buildFoliage(geo, items, hexes, transl = 1) {
  const mat = setLook(new THREE.MeshStandardMaterial({ side: THREE.DoubleSide, roughness: 0.75, vertexColors: !!geo.attributes.color }), { transl, rim: 0.5 });
  const mesh = new THREE.InstancedMesh(geo, mat, items.length);
  mesh.castShadow = mesh.receiveShadow = true;
  const m = new THREE.Matrix4(), c = new THREE.Color(), palette = pal(...hexes);
  items.forEach((it, i) => {
    mesh.setMatrixAt(i, leafMatrix(m, it.pos, it.axis, it.face, it.size));
    mesh.setColorAt(i, varied(palette, it.t, (it.t * 7.31) % 1, c));
  });
  scene.add(mesh);
  return mesh;
}

const jitter = (rand, s) => new THREE.Vector3((rand() - 0.5) * s, (rand() - 0.5) * s, (rand() - 0.5) * s);
const towardCamera = p => camera.position.clone().sub(p).normalize();

// leaf clusters hanging off a branch, each on its own twig
function canopyLeaves(curve, clusters, rand, items, { tMin = 0.1, hang = [1.2, 3.2], size = [0.35, 0.6] } = {}) {
  for (let ci = 0; ci < clusters; ci++) {
    const p = curve.getPointAt(tMin + rand() * (1 - tMin));
    const end = p.clone().add(new THREE.Vector3((rand() - 0.5) * 1.4, -hang[0] - rand() * (hang[1] - hang[0]), (rand() - 0.5) * 1.0));
    buildTrunk([p, p.clone().lerp(end, 0.5).add(new THREE.Vector3(0, 0.15, 0)), end], 0.014, 0.007, 900 + ci, { tubular: 6, radial: 4, flare: 0 });
    const n = 7 + Math.floor(rand() * 6);
    for (let k = 0; k < n; k++) {
      const axis = new THREE.Vector3((rand() - 0.5) * 2, -0.35 - rand(), (rand() - 0.5) * 1.2);
      const pos = end.clone().addScaledVector(axis.clone().normalize(), 0.05).add(jitter(rand, 0.35));
      items.push({ pos, axis, face: towardCamera(pos).add(jitter(rand, 1.3)), size: size[0] + rand() * (size[1] - size[0]), t: rand() });
    }
  }
}

// a bush of broad leaves fanning up and out from a root point
function bushLeaves(root, count, spread, sizeMin, sizeMax, rand, items) {
  for (let k = 0; k < count; k++) {
    const axis = new THREE.Vector3((rand() - 0.5) * 1.8, 0.35 + rand() * 0.9, (rand() - 0.5) * 0.8);
    const pos = root.clone().addScaledVector(axis.clone().normalize(), rand() * spread * 0.7)
      .add(new THREE.Vector3((rand() - 0.5) * spread * 0.6, 0, (rand() - 0.5) * spread * 0.4));
    items.push({ pos, axis, face: towardCamera(pos).add(jitter(rand, 1.2)), size: sizeMin + rand() * (sizeMax - sizeMin), t: rand() });
  }
}

// a fern: fronds radiating out and arching over
function fernFronds(root, count, len, rand, items) {
  for (let k = 0; k < count; k++) {
    const a = (k / count) * Math.PI * 2 + rand() * 0.5;
    const axis = new THREE.Vector3(Math.cos(a) * 0.8, 0.55 + rand() * 0.3, Math.sin(a) * 0.8);
    items.push({ pos: root.clone(), axis, face: new THREE.Vector3(0, 1, 0).add(towardCamera(root).multiplyScalar(0.6)).add(jitter(rand, 0.6)),
      size: len * (0.7 + rand() * 0.5), t: rand() });
  }
}

// ---------- Grass tufts on the flat tops of the foreground rocks ----------
function buildGrass(rocks, tuftsPerRock, rand, extraSpots = []) {
  const blade = new THREE.PlaneGeometry(0.05, 1, 1, 4).translate(0, 0.5, 0);
  const bp = blade.attributes.position, shade = new Float32Array(bp.count * 3);
  for (let i = 0; i < bp.count; i++) {
    const y = bp.getY(i);
    bp.setX(i, bp.getX(i) * (1 - y * 0.9));
    bp.setZ(i, 0.3 * y * y);
    const s = 0.35 + 0.65 * y; // darker at the root
    shade.set([s, s, s], i * 3);
  }
  blade.setAttribute('color', new THREE.BufferAttribute(shade, 3));
  blade.computeVertexNormals();

  const spots = [];
  rocks.forEach((rock, ri) => {
    const pos = rock.geometry.attributes.position, nrm = rock.geometry.attributes.normal;
    let minY = Infinity, maxY = -Infinity;
    for (let i = 0; i < pos.count; i++) { minY = Math.min(minY, pos.getY(i)); maxY = Math.max(maxY, pos.getY(i)); }
    const cands = [];
    for (let i = 0; i < pos.count; i++) if (nrm.getY(i) > 0.8 && pos.getY(i) > maxY - (maxY - minY) * 0.3) cands.push(i);
    for (let t = 0; t < tuftsPerRock[ri] && cands.length; t++) {
      const i = cands[Math.floor(rand() * cands.length)];
      spots.push(new THREE.Vector3(pos.getX(i), pos.getY(i), pos.getZ(i)).add(rock.position));
    }
  });

  spots.push(...extraSpots);
  const PER = 9;
  const mesh = new THREE.InstancedMesh(blade, windify(setLook(new THREE.MeshStandardMaterial({ vertexColors: true, side: THREE.DoubleSide, roughness: 0.8 }), { transl: 0.5, rim: 0.3 }), { amount: 0.3, idle: 0.025 }), spots.length * PER);
  mesh.castShadow = mesh.receiveShadow = true;
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), s = new THREE.Vector3(), p = new THREE.Vector3();
  const grassPal = pal('#4c6a2e', '#5b7834', '#6a8438', '#7c8c46', '#8c8758', '#566b38'), c = new THREE.Color();
  let n = 0;
  for (const spot of spots) {
    for (let b = 0; b < PER; b++) {
      p.copy(spot).add(new THREE.Vector3((rand() - 0.5) * 0.3, -0.03, (rand() - 0.5) * 0.3));
      q.setFromEuler(e.set((rand() - 0.5) * 0.7, rand() * Math.PI * 2, (rand() - 0.5) * 0.7));
      const h = 0.2 + rand() * 0.34;
      s.set(1, h, 1);
      if (INK && Math.random() > 0.12) s.set(0, 0, 0);   // ink: a few strokes suggest the grass; every blade would be a scribble
      mesh.setMatrixAt(n, m.compose(p, q, s));
      mesh.setColorAt(n, varied(grassPal, rand(), rand(), c));
      n++;
    }
  }
  scene.add(mesh);
}

// ---------- Waterfall: a ribbon of water following a path, with streaks that speed up where it falls ----------
const fallMat = new THREE.ShaderMaterial({
  transparent: true,
  depthWrite: false,
  side: THREE.DoubleSide,
  uniforms: { ...skyUniforms, cDeep: { value: col(PALETTE.water) }, calm: { value: 0 } },
  vertexShader: /* glsl */`
    attribute float aSteep;
    varying vec2 vUv;
    varying float vSteep;
    void main() {
      vUv = uv;
      vSteep = aSteep;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }`,
  fragmentShader: SKY_GLSL + /* glsl */`
    uniform vec3 cDeep;
    uniform float calm;
    varying vec2 vUv;
    varying float vSteep;
    void main() {
      float speed = mix(0.7, 2.6, vSteep);
      float streak = fbm(vec2(vUv.x * 7.0, vUv.y * 0.9 - time * speed));
      float fine = fbm(vec2(vUv.x * 19.0, vUv.y * 2.6 - time * speed * 1.7));
      float foam = clamp(smoothstep(mix(0.42, 0.62, calm), mix(0.78, 0.95, calm), streak * 0.6 + fine * 0.5) + vSteep * mix(0.45, 0.9, calm), 0.0, 1.0);
      vec3 body = mix(cDeep, skyColor(normalize(vec3(0.25, 0.3, -1.0))) * vec3(0.88, 0.97, 1.08) * mix(1.0, 0.3, calm), mix(0.4, 0.35, calm));
      body *= 1.0 + calm * (0.25 * fine - 0.1);                        // gentle ripples on the calm runs
      body += calm * cGlow * pow(smoothstep(0.62, 0.9, fine), 3.0) * 1.5; // sun sparkles
      vec3 c = mix(body, vec3(1.0, 0.97, 0.9) * 1.12, foam);
      float e0 = mix(0.2, 0.35, calm);
      float edge = smoothstep(0.0, e0, vUv.x) * smoothstep(1.0, 1.0 - e0, vUv.x);
      gl_FragColor = vec4(c, edge * mix(mix(0.6, 0.8, calm), 0.95, foam));
    }`,
});

// the brook: same water, but clear and blue on its calm runs
const brookMat = new THREE.ShaderMaterial({ transparent: true, depthWrite: false, side: THREE.DoubleSide,
  uniforms: { ...fallMat.uniforms, calm: { value: 1 } }, vertexShader: fallMat.vertexShader, fragmentShader: fallMat.fragmentShader });

function buildRibbon(points, widths, mat) {
  const curve = new THREE.CatmullRomCurve3(points);
  const N = 90, len = curve.getLength();
  const pos = [], uv = [], steep = [], idx = [];
  const up = new THREE.Vector3(0, 1, 0), side = new THREE.Vector3(), p = new THREE.Vector3(), t = new THREE.Vector3();
  for (let i = 0; i <= N; i++) {
    const u = i / N;
    curve.getPointAt(u, p);
    curve.getTangentAt(u, t);
    side.crossVectors(t, up);
    if (side.lengthSq() < 1e-4) side.set(1, 0, 0);
    side.normalize();
    const wi = u * (widths.length - 1), w = THREE.MathUtils.lerp(widths[Math.floor(wi)], widths[Math.min(Math.ceil(wi), widths.length - 1)], wi % 1) / 2;
    pos.push(p.x - side.x * w, p.y - side.y * w, p.z - side.z * w, p.x + side.x * w, p.y + side.y * w, p.z + side.z * w);
    uv.push(0, u * len, 1, u * len);
    const s = THREE.MathUtils.clamp((-t.y - 0.3) / 0.5, 0, 1);
    steep.push(s, s);
    if (i < N) { const a = i * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  geo.setAttribute('aSteep', new THREE.Float32BufferAttribute(steep, 1));
  geo.setIndex(idx);
  const mesh = new THREE.Mesh(geo, mat);
  mesh.renderOrder = 2;
  scene.add(mesh);
  return mesh;
}

// ---------- Hillside: the grassy slope from the camp down to the bottom of the frame, cut by the brook ----------
// The brook below the waterfall: [x, water level, z], stepping down in small cascades towards the bottom-right
const BROOK = [
  [1.6, 54.25, -18.6], [3.2, 54.2, -18.4], [4.6, 54.15, -17.9], [5.0, 53.65, -17.4], [6.0, 53.6, -16.3],
  [6.3, 53.1, -15.8], [7.2, 53.05, -14.6], [7.5, 52.6, -14.1], [9.0, 52.55, -12.6], [11.5, 52.45, -10.8], [14, 52.3, -9],
];
// distance (in plan) from the brook's centre line, and the water level there
function brookAt(x, z) {
  let best = Infinity, wy = 0;
  for (let i = 0; i + 1 < BROOK.length; i++) {
    const [ax, ay, az] = BROOK[i], [bx, by, bz] = BROOK[i + 1];
    const dx = bx - ax, dz = bz - az;
    const t = THREE.MathUtils.clamp(((x - ax) * dx + (z - az) * dz) / (dx * dx + dz * dz), 0, 1);
    const d = Math.hypot(x - ax - dx * t, z - az - dz * t);
    if (d < best) { best = d; wy = ay + (by - ay) * t; }
  }
  return { d: best, y: wy };
}
const hillNoise = makeNoise(mulberry32(717));
function hillLand(x, z) {
  let h = 54.3 + 2.4 * smooth(-10, -19.2, z);                     // rises from the bottom of the frame to the camp ledge
  h -= 2.1 * smooth(-4, 3, x);                                    // and falls away to the right, down to the brook
  h += 1.0 * smooth(8, 14, x) * smooth(-9, -15, z);               // the far bank rises again at the right edge
  h += 0.4 * fbm(hillNoise, x * 0.16, 0.3, z * 0.16, 3) + 0.1 * hillNoise(x * 0.9, 1.7, z * 0.9);
  return h;
}
function hillHeight(x, z) {
  const b = brookAt(x, z), land = hillLand(x, z), bed = b.y - 0.3;
  const rim = b.y + 0.12;                                          // banks meet the water's edge, so it sits in its bed
  let h = bed + (rim - bed) * smooth(0.45, 1.25, b.d);
  h += (Math.max(land, rim) - rim) * smooth(1.25, 5.5, b.d);       // then a broad, shallow valley up to the meadow
  return h - 4 * smooth(-18.8, -19.6, z);                         // tuck the far edge down out of sight behind the ledge
}
function buildHillside() {
  const x0 = -20, x1 = 20, z0 = -19.6, z1 = -6, step = 0.15;
  const nx = Math.round((x1 - x0) / step), nz = Math.round((z1 - z0) / step);
  const geo = new THREE.PlaneGeometry(x1 - x0, z1 - z0, nx, nz).rotateX(-Math.PI / 2).translate(0, 0, (z0 + z1) / 2);
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) pos.setY(i, hillHeight(pos.getX(i), pos.getZ(i)));
  geo.computeVertexNormals();
  const nrm = geo.attributes.normal, colors = new Float32Array(pos.count * 3);
  const grass = pal('#4a6a28', '#587a2c', '#678632', '#7a8e3a', '#526e2c', '#8a8c44');
  const earth = pal('#3e382c', '#4a4232', '#38342a', '#55503e');
  const c = new THREE.Color(), e = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    varied(grass, 0.5 + 0.9 * hillNoise(x * 0.12, 4.4, z * 0.12), 0.5 + hillNoise(x * 0.6, 8.8, z * 0.6), c);
    c.multiplyScalar(0.8 + 0.35 * smooth(0.75, 1.0, nrm.getY(i)));                         // slopes a touch darker than flats
    const b = brookAt(x, z);
    c.lerp(varied(earth, 0.5 + hillNoise(x * 0.5, 2.1, z * 0.5), 0.5, e), smooth(1.9, 1.0, b.d)); // wet earth and stones by the water
    colors.set([c.r, c.g, c.b], i * 3);
  }
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  const mesh = new THREE.Mesh(geo, setLook(new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1 }), { rim: 0.25 }));
  mesh.receiveShadow = mesh.castShadow = true;
  scene.add(mesh);
  return mesh;
}

// ---------- Assemble the foreground ----------
function buildForeground() {

  const fg = (seed, center, size, column = 0.5, detail = 64) => buildRockMass({ seed, center, size, column, detail, shadows: true, rough: 0.1, tint: 0.95 });

    [726, 5.4, -16.8, 0.8, 0.6, 0.7, [0.3, 0.5, 0]],  [727, 7.0, -15.3, 0.7, 0.5, 0.6, [0, 1.0, 0.2]],

  // 15. waterfall: a spring wells up from under a boulder behind the shelf, runs over the shelf's surface

  const rightBranch = buildTrunk([new THREE.Vector3(5.4, 61.5, -8), new THREE.Vector3(4.3, 62.4, -8.8), new THREE.Vector3(3.4, 63.1, -9.5)], 0.1, 0.03, 805, { tubular: 16, radial: 6, flare: 0 });

  // 19. bushes in the bottom corners and ferns on the rocks

  fernFronds(new THREE.Vector3(-2.6, hillHeight(-2.6, -14.4), -14.4), 9, 0.8, rand, fernItems);
  fernFronds(onPlane(0.12, 0.66, 56), 9, 1.0, rand, fernItems);

  // 20. grass and moss tufts on the flat tops
  const hillSpots = [];
  for (let tries = 0; hillSpots.length < 2800 && tries < 20000; tries++) {

    flowerItems.push({ pos: p, axis: new THREE.Vector3(rand() - 0.5, 0, rand() - 0.5).normalize(),

  const flowers = buildFoliage(makeFlowerGeometry(), flowerItems, ['#c27a8a', '#e6dfcc', '#b86a7a', '#e6dfcc', '#d4b45e', '#c9909e'], 0.3);
  flowers.castShadow = false;
  windify(flowers.material, { amount: 0.35, idle: 0.02 });
  return { ledge, fallBase };
}

const updaters = []; // per-frame animation hooks, called from the render loop with the elapsed time
let heroTarget = null; // the seated figure: the camera focuses on it and a soft light pools around it

const std = (hex, extra = {}) => new THREE.MeshStandardMaterial({ color: col(hex), roughness: 0.9, ...extra });

// a straight round piece (pole, strap, guy line) between two points
function stick(a, b, r, mat, radial = 6) {
  const dir = b.clone().sub(a);
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(r, r, dir.length(), radial), mat);
  mesh.position.copy(a).add(b).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
  return mesh;
}
// a rounded limb between two points
function limb(a, b, r, mat) {
  const dir = b.clone().sub(a);
  const mesh = new THREE.Mesh(new THREE.CapsuleGeometry(r, Math.max(dir.length(), 0.001), 4, 12), mat);
  mesh.position.copy(a).add(b).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
  return mesh;
}

// soft radial glow texture for the lantern halo
function glowTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  grd.addColorStop(0, 'rgba(255,255,255,1)');
  grd.addColorStop(0.25, 'rgba(255,255,255,0.45)');
  grd.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grd;
  g.fillRect(0, 0, 128, 128);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

// the seated figure, built facing -z with its feet at the origin; knees up, arms wrapped round them

    g.add(limb(V(0.11 * s, 0.4, -0.3), V(0.12 * s, 0.06, -0.42), 0.06, pants));   // shin
    const boot = new THREE.Mesh(new RoundedBoxGeometry(0.1, 0.09, 0.2, 2, 0.03), boots);
    boot.position.set(0.12 * s, 0.045, -0.47);
