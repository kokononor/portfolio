function buildCamp(ledge) {
  scene.updateMatrixWorld(true);
  const ray = new THREE.Raycaster();
  const down = new THREE.Vector3(0, -1, 0);
  // the ledge surface under a screen position
  const ground = (sx, sy) => {
    const p = onPlane(sx, sy, 57);
    ray.set(new THREE.Vector3(p.x, 80, p.z), down);
    const hit = ray.intersectObject(ledge, false)[0];
    p.y = hit ? hit.point.y : 57;
    return p;
  };
  const camp = new THREE.Group();
  scene.add(camp);

  // --- A-frame of two crossed sticks; the lantern hangs where they cross ---
  const cross = atDist(0.31, 0.405, 23);
  const woodA = std('#5a4630'), woodB = std('#4a3a28');
  const poleA = ground(0.285, 0.556), poleB = ground(0.338, 0.562);
  const ext = (base, by) => cross.clone().add(cross.clone().sub(base).normalize().multiplyScalar(by));
  camp.add(stick(poleA.clone().add(new THREE.Vector3(0, -0.2, 0)), ext(poleA, 0.3), 0.045, woodA));
  camp.add(stick(poleB.clone().add(new THREE.Vector3(0, -0.2, 0)), ext(poleB, 0.22), 0.04, woodB));

  // --- tarp: a cloth sheet from the A-frame down to the left, sagging and stirring in the breeze ---
  const C0 = cross.clone().add(new THREE.Vector3(-0.05, 0.02, 0)); // top right, on the A-frame
  const C1 = atDist(0.255, 0.425, 20.8);                           // top left, in front of the leaning trunk
  const C2 = atDist(0.15, 0.475, 21);                              // bottom left, tied up off the ground
  const C3 = ground(0.235, 0.54).add(new THREE.Vector3(0, 0.05, 0)); // bottom front, staked
  const SEG_U = 22, SEG_V = 16;
  const tarpGeo = new THREE.PlaneGeometry(1, 1, SEG_U, SEG_V);
  const tarpPos = tarpGeo.attributes.position;
  const tarpNoise = makeNoise(mulberry32(55));
  const tarpCols = new Float32Array(tarpPos.count * 3), canvasPal = pal('#a8603c', '#9a5838', '#b06a46', '#8e5234');
  const tc = new THREE.Color();
  const baseP = [], uvs = [];
  for (let i = 0; i < tarpPos.count; i++) {
    const u = THREE.MathUtils.clamp(tarpPos.getX(i) + 0.5, 0, 1), v = THREE.MathUtils.clamp(0.5 - tarpPos.getY(i), 0, 1);
    const top = C0.clone().lerp(C1, u), bottom = C3.clone().lerp(C2, u);
    const p = top.lerp(bottom, v);
    p.y -= 0.22 * Math.sin(Math.PI * u) * Math.sin(Math.PI * v); // sag
    baseP.push(p);
    uvs.push([u, v]);
    varied(canvasPal, 0.5 + tarpNoise(u * 3, v * 3, 0.5), 0.5, tc);
    tc.multiplyScalar(0.85 + 0.15 * (1 - v));                        // dirtier towards the ground
    tarpCols.set([tc.r, tc.g, tc.b], i * 3);
  }
  tarpGeo.setAttribute('color', new THREE.BufferAttribute(tarpCols, 3));
  const tarpNormal = C1.clone().sub(C0).cross(C3.clone().sub(C0)).normalize();
  const tarpMat = setLook(new THREE.MeshStandardMaterial({ vertexColors: true, side: THREE.DoubleSide, roughness: 0.95 }), { transl: 0.35, rim: 0.25 }); // sun glows softly through the canvas
  const tarp = new THREE.Mesh(tarpGeo, tarpMat);
  camp.add(tarp);
  const tarpCenter = C0.clone().add(C1).add(C2).add(C3).multiplyScalar(0.25);
  const tw = new THREE.Vector2(), tWorld = new THREE.Vector3();
  let billow = 0, flutter = 0;
  updaters.push(t => {
    windToWorld(windAtWorld(tarpCenter, tw), tWorld);
    billow += (tWorld.dot(tarpNormal) * 0.5 - billow) * 0.06;        // cloth has inertia
    flutter += (Math.min(tw.length(), 1) - flutter) * 0.1;
    for (let i = 0; i < tarpPos.count; i++) {
      const [u, v] = uvs[i], p = baseP[i];
      const pin = Math.sin(Math.PI * u) * Math.sin(Math.PI * v); // corners stay tied down
      const w = 0.035 * Math.sin(t * 2.1 + u * 7 + v * 5) + 0.02 * Math.sin(t * 3.7 - u * 11 + v * 3) + 0.03 * Math.sin(t * 0.7)
        + billow + flutter * 0.08 * Math.sin(t * 11 + u * 13 + v * 7);
      tarpPos.setXYZ(i, p.x + tarpNormal.x * w * pin, p.y + tarpNormal.y * w * pin, p.z + tarpNormal.z * w * pin);
    }
    tarpPos.needsUpdate = true;
    tarpGeo.computeVertexNormals();
  });
  // guy lines
  const rope = std('#2f2a22');
  camp.add(stick(C2, C2.clone().add(new THREE.Vector3(-0.6, 0.5, 0.2)), 0.008, rope, 3));
  camp.add(stick(C3, ground(0.215, 0.56), 0.008, rope, 3));

  // --- lantern hanging from the cross, flickering, with a soft halo ---
  const lantern = new THREE.Group();
  lantern.position.copy(cross).add(new THREE.Vector3(0.04, -0.03, 0.08));
  lantern.scale.setScalar(1.7);
  camp.add(lantern);
  const metal = std('#2d2a24', { metalness: 0.6, roughness: 0.5 });
  lantern.add(stick(new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, -0.2, 0), 0.006, metal, 4));          // wire
  const handle = new THREE.Mesh(new THREE.TorusGeometry(0.09, 0.007, 4, 16, Math.PI), metal);
  handle.position.y = -0.22;
  lantern.add(handle);
  const cap = new THREE.Mesh(new THREE.ConeGeometry(0.11, 0.08, 16), metal);
  cap.position.y = -0.27;
  lantern.add(cap);
  const glassMat = new THREE.MeshStandardMaterial({ color: col('#ffe3a0'), emissive: col('#ffb04a'), emissiveIntensity: 2.2,
    transparent: true, opacity: 0.85, roughness: 0.2 });
  const glass = new THREE.Mesh(new THREE.CylinderGeometry(0.085, 0.085, 0.2, 20), glassMat);
  glass.position.y = -0.41;
  lantern.add(glass);
  for (let k = 0; k < 3; k++) { // frame rods
    const a = (k / 3) * Math.PI * 2;
    lantern.add(stick(new THREE.Vector3(Math.cos(a) * 0.092, -0.3, Math.sin(a) * 0.092), new THREE.Vector3(Math.cos(a) * 0.092, -0.52, Math.sin(a) * 0.092), 0.006, metal, 4));
  }
  const flameMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(1, 0.8, 0.45).multiplyScalar(5), fog: false });
  const flame = new THREE.Mesh(new THREE.SphereGeometry(0.028, 12, 8), flameMat);
  flame.scale.y = 1.7;
  flame.position.y = -0.42;
  lantern.add(flame);
  const lbase = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.105, 0.07, 20), metal);
  lbase.position.y = -0.545;
  lantern.add(lbase);

  const lampLight = new THREE.PointLight(col('#ffad55'), 6, 7, 1.6);
  lampLight.position.y = -0.42;
  lantern.add(lampLight);

  const tex = glowTexture();
  const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, color: col('#ffc775'), blending: THREE.AdditiveBlending,
    transparent: true, depthWrite: false, fog: false }));
  halo.position.y = -0.42;
  halo.scale.setScalar(1.2);
  lantern.add(halo);
  const haloWide = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, color: col('#ffb060'), blending: THREE.AdditiveBlending,
    transparent: true, depthWrite: false, fog: false, opacity: 0.18 }));
  haloWide.position.y = -0.42;
  haloWide.scale.setScalar(3.6);
  lantern.add(haloWide);

  const flick = makeNoise(mulberry32(99));
  const flameBase = new THREE.Color(1, 0.8, 0.45);
  const lw = new THREE.Vector2();
  let swing = 0, swingVel = 0, gutter = 0;
  updaters.push(t => {
    // the wind pushes the lantern; it swings back on its wire like a pendulum
    windAtWorld(lantern.position, lw);
    swingVel += ((lw.x * 0.5 - swing) * 4.0 - swingVel * 1.2) * 0.016;
    swing += swingVel * 0.016;
    gutter += (Math.min(lw.length(), 1) - gutter) * 0.15;
    // layered slow waver + fast irregular flutter, never fully regular; a gust makes the flame gutter
    const f = (0.84 + 0.08 * Math.sin(t * 7.3) * Math.sin(t * 2.1 + 1) + 0.14 * flick(t * 3.1, 0.5, 0.5) + 0.07 * flick(t * 11.7, 2.5, 0.5))
      * (1 - 0.35 * gutter * (0.5 + 0.5 * Math.sin(t * 23)));
    lampLight.intensity = 6 * f;
    glassMat.emissiveIntensity = 2.2 * f;
    flameMat.color.copy(flameBase).multiplyScalar(5 * f);
    flame.scale.set(1 - 0.1 * (f - 0.84), 1.7 + 0.5 * (f - 0.84), 1);
    halo.material.opacity = 0.6 * f;
    halo.scale.setScalar(1.1 + 0.25 * f);
    haloWide.material.opacity = 0.16 * f;
    lantern.rotation.z = 0.05 * Math.sin(t * 1.1) + swing;  // gentle sway on its wire, plus the gust
    lantern.rotation.x = 0.03 * Math.sin(t * 0.83 + 1);
  });

  // --- backpack with a rolled mat, a thermos, a mug, a few stones ---
  const packPos = ground(0.298, 0.568);
  const pack = new THREE.Group();
  pack.position.copy(packPos);
  pack.rotation.set(0.12, 0.5, 0.05); // leaning back a little
  pack.scale.setScalar(1.6);
  camp.add(pack);
  const canvasOlive = std('#6f6440'), pocket = std('#5d5536'), strap = std('#2f2a20');
  const body = new THREE.Mesh(new RoundedBoxGeometry(0.5, 0.65, 0.32, 3, 0.08), canvasOlive);
  body.position.y = 0.32;
  pack.add(body);
  const front = new THREE.Mesh(new RoundedBoxGeometry(0.36, 0.26, 0.1, 3, 0.04), pocket);
  front.position.set(0, 0.22, -0.19);
  pack.add(front);
  const flap = new THREE.Mesh(new RoundedBoxGeometry(0.48, 0.08, 0.34, 2, 0.03), pocket);
  flap.position.y = 0.66;
  pack.add(flap);
  const bedroll = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.58, 16), std('#a8402e'));
  bedroll.rotation.z = Math.PI / 2;
  bedroll.position.y = 0.78;
  pack.add(bedroll);
  for (const sx of [-0.13, 0.13]) {
    const s = new THREE.Mesh(new THREE.BoxGeometry(0.035, 0.6, 0.02), strap);
    s.position.set(sx, 0.34, -0.17);
    pack.add(s);
  }
  const thermos = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 0.28, 14), std('#8a3b2a', { roughness: 0.5 }));
  thermos.position.copy(ground(0.312, 0.572)).add(new THREE.Vector3(0, 0.21, 0));
  thermos.scale.setScalar(1.5);
  camp.add(thermos);
  const mug = new THREE.Group();
  mug.position.copy(ground(0.335, 0.577));
  mug.scale.setScalar(1.6);
  const enamel = std('#6d7b80', { roughness: 0.4 });
  const cup = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.045, 0.1, 16), enamel);
  cup.position.y = 0.05;
  mug.add(cup);
  const mugHandle = new THREE.Mesh(new THREE.TorusGeometry(0.03, 0.008, 4, 10, Math.PI), enamel);
  mugHandle.rotation.z = -Math.PI / 2;
  mugHandle.position.set(0.05, 0.05, 0);
  mug.add(mugHandle);
  camp.add(mug);
  const stonePal = pal('#6b6e6a', '#7a7a74', '#5c5e5a');
  const sRand = mulberry32(8);
  for (const [sx, sy] of [[0.272, 0.566], [0.318, 0.58], [0.39, 0.578]]) {
    const st = new THREE.Mesh(new THREE.IcosahedronGeometry(0.08 + sRand() * 0.06, 1), std('#ffffff', { flatShading: true }));
    st.material.color.copy(varied(stonePal, sRand(), sRand()));
    st.position.copy(ground(sx, sy)).add(new THREE.Vector3(0, 0.03, 0));
    st.scale.y = 0.6;
    st.rotation.set(sRand() * 3, sRand() * 3, 0);
    camp.add(st);
  }

  // --- the person, sitting at the edge and looking out over the valley towards the sun ---
  const person = buildPerson();
  person.position.copy(ground(0.36, 0.574));
  person.scale.setScalar(2.1);
  const facing = new THREE.Vector3(0.6, 0, -0.8);
  person.rotation.y = Math.atan2(-facing.x, -facing.z);
  camp.add(person);
  const torso = person.children[1];
  updaters.push(t => { torso.scale.set(1, 1, 1 + 0.03 * Math.sin(t * 1.6)); }); // slow breathing
  heroTarget = person;

  // a soft warm pool of light on the figure and the grass around him, so the eye lands on him first
  const heroLight = new THREE.SpotLight(col('#ffc98e'), 7, 7, 0.7, 0.9, 1.4);
  heroLight.position.copy(person.position).add(new THREE.Vector3(1.4, 2.6, 2.6));
  heroLight.target.position.copy(person.position).add(new THREE.Vector3(0, 0.7, 0));
  camp.add(heroLight, heroLight.target);
  camp.traverse(o => { if (o.isMesh && !o.material.transparent && !o.material.isMeshBasicMaterial) o.castShadow = o.receiveShadow = true; });

  // The real character: cut the seated, knees-hugging pose out of the Meshy character sheet and swap it in
  // for the placeholder once it has loaded. If it fails to load, the placeholder simply stays.
  loadSeatedCharacter().then(figure => {
    figure.position.copy(person.position);
    figure.rotation.y = Math.atan2(facing.x, facing.z); // the sheet's figures face +z
    camp.remove(person);
    camp.add(figure);
    heroTarget = figure;
    figure.castShadow = figure.receiveShadow = true;
    markShadowsDirty();
    const baseScale = figure.scale.y;
    updaters.push(t => { figure.scale.y = baseScale * (1 + 0.006 * Math.sin(t * 1.6)); }); // slow breathing
  }).catch(err => console.warn('Character model not loaded, keeping placeholder:', err));
}

// The sheet holds several poses side by side; this box (in the sheet's own units) contains only the seated
// figure hugging its knees, from just above the rock it sat on to the top of its hair.
const SEATED_BOX = new THREE.Box3(new THREE.Vector3(-0.44, -0.475, 0.02), new THREE.Vector3(-0.1, -0.08, 0.5));
const SEATED_HEIGHT = 1.7; // in scene units, matched to the placeholder

async function loadSeatedCharacter() {
  const gltf = await new GLTFLoader().loadAsync('models/trailbound.glb');
  gltf.scene.updateMatrixWorld(true);
  let source;
  gltf.scene.traverse(o => { if (o.isMesh && !source) source = o; });
  const geo = source.geometry.clone().applyMatrix4(source.matrixWorld);

  // keep only the triangles whose centre falls inside the box, and only the vertices they use
  const pos = geo.attributes.position, index = geo.index;
  const triCount = index ? index.count / 3 : pos.count / 3;
  const vi = k => (index ? index.getX(k) : k);
  const remap = new Map(), newIndex = [];
  const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3();
  for (let t = 0; t < triCount; t++) {
    const i0 = vi(t * 3), i1 = vi(t * 3 + 1), i2 = vi(t * 3 + 2);
    a.fromBufferAttribute(pos, i0); b.fromBufferAttribute(pos, i1); c.fromBufferAttribute(pos, i2);
    if (!SEATED_BOX.containsPoint(a.add(b).add(c).multiplyScalar(1 / 3))) continue;
    for (const i of [i0, i1, i2]) {
      if (!remap.has(i)) remap.set(i, remap.size);
      newIndex.push(remap.get(i));
    }
  }
  const out = new THREE.BufferGeometry();
  for (const name of Object.keys(geo.attributes)) {
    const src = geo.attributes[name], dst = new Float32Array(remap.size * src.itemSize);
    for (const [oldI, newI] of remap) for (let k = 0; k < src.itemSize; k++) dst[newI * src.itemSize + k] = src.getComponent(oldI, k);
    out.setAttribute(name, new THREE.BufferAttribute(dst, src.itemSize));
  }
  out.setIndex(newIndex);

  // sit it on the origin: centred in x/z, lowest point at y = 0, scaled to the scene
  out.computeBoundingBox();
  const bb = out.boundingBox, centre = bb.getCenter(new THREE.Vector3());
  out.translate(-centre.x, -bb.min.y, -centre.z);
  out.computeBoundingSphere();

  const mat = source.material;
  setLook(mat, { rim: 1.2 }); // strong rim so the silhouette separates from the bright valley
  const figure = new THREE.Mesh(out, mat);
  figure.scale.setScalar(SEATED_HEIGHT / (bb.max.y - bb.min.y));
  geo.dispose();
  return figure;
}

// ================= Atmosphere: fog sheets, mist banks, dust, fireflies, waterfall spray =================
const atmoMix = { value: 1 }; // 0..1, eased by the atmosphere toggle
const NOISE_GLSL = /* glsl */`
  float nHash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
  float nNoise(vec2 p) {
    vec2 i = floor(p), f = fract(p);
    f = f * f * (3.0 - 2.0 * f);
    return mix(mix(nHash(i), nHash(i + vec2(1, 0)), f.x), mix(nHash(i + vec2(0, 1)), nHash(i + vec2(1, 1)), f.x), f.y);
  }
  float nFbm(vec2 p) { return 0.5 * nNoise(p) + 0.3 * nNoise(p * 2.07 + 3.1) + 0.2 * nNoise(p * 4.13 + 7.7); }
`;

const pointScale = () => innerHeight * renderer.getPixelRatio() * 0.5 / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
const particleUniforms = { time: skyUniforms.time, sunDir: skyUniforms.sunDir, pointScale: { value: pointScale() }, windTex: windUniforms.windTex, atmoMix };

// a soft cloud puff drawn from overlapping radial blobs, kept clear of the texture edges
function puffTexture(seed) {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const g = c.getContext('2d'), r = mulberry32(seed);
  for (let i = 0; i < 45; i++) {
    const x = 128 + (r() - 0.5) * 100, y = 140 + (r() - 0.5) * 60, rad = 25 + r() * 30;
    const grd = g.createRadialGradient(x, y, 0, x, y, rad);
    grd.addColorStop(0, 'rgba(255,255,255,0.16)');
    grd.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = grd;
    g.fillRect(0, 0, 256, 256);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function buildAtmosphere(fallBase) {
  const group = new THREE.Group();
  scene.add(group);
  const rand = mulberry32(4242);
  const lit = col(PALETTE.mistLit), shade = col(PALETTE.mistShade);

  // --- 25. drifting fog sheets: stacked layers of slowly warping noise over the valley ---
  // Seen edge-on they thicken (more fog along the line of sight), so the stack reads as volume.
  const sheetMat = (height, alpha, seed) => new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    uniforms: { time: skyUniforms.time, sunDir: skyUniforms.sunDir, lit: { value: lit }, shade: { value: shade },
      alpha: { value: alpha }, seed: { value: seed }, fogIntro: mistUniforms.fogIntro, atmoMix, ...windUniforms },
    vertexShader: /* glsl */`
      varying vec3 vWorld;
      void main() {
        vWorld = (modelMatrix * vec4(position, 1.0)).xyz;
        gl_Position = projectionMatrix * viewMatrix * vec4(vWorld, 1.0);
      }`,
    fragmentShader: NOISE_GLSL + /* glsl */`
      uniform float time, alpha, seed, fogIntro, atmoMix;
      uniform vec2 resolution;
      ${WIND_GLSL}
      uniform vec3 sunDir, lit, shade;
      varying vec3 vWorld;
      void main() {
        vec2 p = vWorld.xz * 0.0055 + vec2(seed + time * 0.009, seed * 0.7 + time * 0.0035);
        vec2 warp = vec2(nFbm(p * 1.3 + vec2(5.2, time * 0.006)), nFbm(p * 1.3 - vec2(3.1, time * 0.004)));
        vec2 gw = windAtUv(gl_FragCoord.xy / resolution);
        p -= vec2(gw.x, -gw.y) * 0.14;                                               // the pattern slides gently downwind
        float dens = smoothstep(0.42, 0.82, nFbm(p + warp * 0.9));   // patchier: banks and gaps, not a wall
        dens *= 1.0 - 0.3 * smoothstep(0.0, 1.0, length(gw));                        // and thins a little, never a hole
        vec3 toFrag = vWorld - cameraPosition;
        float dist = length(toFrag);
        vec3 V = toFrag / dist;
        dens *= smoothstep(55.0, 140.0, dist) * (1.0 - smoothstep(750.0, 1150.0, dist));
        dens *= clamp(0.14 / max(abs(V.y), 0.01), 0.5, 3.0);                    // grazing view = thicker
        float sunAmt = pow(max(dot(V, sunDir), 0.0), 3.0);
        vec3 c = mix(shade, lit, 0.3 + 0.7 * sunAmt) * (1.0 + 0.25 * pow(max(dot(V, sunDir), 0.0), 12.0));
        gl_FragColor = vec4(c, clamp(dens * alpha * (1.0 + 1.5 * fogIntro), 0.0, 0.7) * atmoMix);
      }`,
  });
  const layers = [[6, 0.3], [12, 0.27], [18, 0.23], [25, 0.18], [32, 0.13], [40, 0.08], [49, 0.04]];
  layers.forEach(([h, a], i) => {
    const geo = new THREE.PlaneGeometry(1800, 1100, 90, 55).rotateX(-Math.PI / 2).translate(80, h, -620);
    const gp = geo.attributes.position;
    for (let k = 0; k < gp.count; k++) gp.setY(k, h + 4 * nHills(gp.getX(k) * 0.01, h * 0.1, gp.getZ(k) * 0.01)); // wavy, so edges don't line up as contours
    const sheet = new THREE.Mesh(geo, sheetMat(h, a, i * 3.7));
    sheet.renderOrder = 3;
    group.add(sheet);
  });

  // --- mist banks: soft cloud puffs hugging the river, islands and the base of the pillars ---
  const puffTex = [puffTexture(1), puffTexture(2), puffTexture(3)];
  const puffs = [];
  const addPuff = (x, y, z, w, opacity) => {
    const dir = new THREE.Vector3(x, y, z).sub(camera.position).normalize();
    const sunAmt = Math.pow(Math.max(dir.dot(sunDir), 0), 3);
    const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: puffTex[puffs.length % 3], color: shade.clone().lerp(lit, 0.35 + 0.65 * sunAmt),
      transparent: true, depthWrite: false, fog: false, opacity }));
    sprite.position.set(x, y, z);
    sprite.scale.set(w, w * 0.5, 1);
    sprite.renderOrder = 4;
    group.add(sprite);
    puffs.push({ sprite, x, baseOpacity: opacity, phase: rand() * 6.28, speed: 0.015 + rand() * 0.02, amp: 8 + rand() * 14 });
  };
  for (let i = 0; i < 44; i++) {
    const d = 160 + rand() * 650;
    const x = riverCenter(d) + (rand() - 0.5) * riverWidth(d) * 1.8;
    const y = Math.max(heightAt(x, -d), 0) + 5 + rand() * 10;
    addPuff(x, y, -d, 60 + rand() * 110, 0.32 + rand() * 0.25);
  }
  for (const s of [[-45, -320], [40, -430], [-180, -250]]) addPuff(s[0] + (rand() - 0.5) * 30, 14 + rand() * 6, s[1] + 20, 70 + rand() * 40, 0.3);
  const pw = new THREE.Vector2(), push = new THREE.Vector3();
  for (const p of puffs) p.push = new THREE.Vector3();
  updaters.push(t => {
    for (const p of puffs) {
      windToWorld(windAtWorld(p.sprite.position, pw), push).multiplyScalar(25);
      p.push.lerp(push, 0.03);                                            // heavy and slow to respond
      p.sprite.position.x = p.x + Math.sin(t * p.speed + p.phase) * p.amp + p.push.x;
      p.sprite.material.opacity = p.baseOpacity * atmoMix.value;
    }
  });

  // --- 27. floating dust in the air near the camera, only visible where the sun catches it ---
  const particles = (count, attrs, vertexBody, fragmentBody, extraUniforms = {}) => {
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(new Float32Array(count * 3), 3));
    const seeds = new Float32Array(count * 4);
    for (let i = 0; i < seeds.length; i++) seeds[i] = rand();
    geo.setAttribute('seed', new THREE.Float32BufferAttribute(seeds, 4));
    const pts = new THREE.Points(geo, new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
      uniforms: { ...particleUniforms, ...extraUniforms },
      vertexShader: /* glsl */`
        attribute vec4 seed;
        uniform float time, pointScale;
        ${WIND_GLSL}
        uniform vec3 sunDir;
        varying float vAlpha;
        varying vec3 vColor;
        ${attrs}
        void main() {
          ${vertexBody}
        }`,
      fragmentShader: /* glsl */`
        uniform float atmoMix;
        varying float vAlpha;
        varying vec3 vColor;
        void main() {
          float r = length(gl_PointCoord - 0.5);
          ${fragmentBody}
          gl_FragColor.a *= atmoMix;
        }`,
    }));
    pts.frustumCulled = false;
    pts.renderOrder = 5;
    group.add(pts);
    return pts;
  };

  particles(220, `uniform vec3 boxMin, boxSize;`, /* glsl */`
      vec3 p = boxMin + seed.xyz * boxSize;
      p.x += time * (0.12 + seed.y * 0.2) + sin(time * 0.3 + seed.z * 20.0) * 0.7;
      p.y += sin(time * 0.4 + seed.x * 30.0) * 0.5 + time * 0.04;
      p.z += cos(time * 0.25 + seed.y * 25.0) * 0.7;
      p = boxMin + mod(p - boxMin, boxSize);               // wrap inside the box
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      mv.xy += windAtClip(projectionMatrix * mv) * 1.2;   // blown by the pointer
      gl_Position = projectionMatrix * mv;
      gl_PointSize = mix(0.025, 0.07, seed.w) * pointScale / -mv.z;
      vec3 V = normalize(p - cameraPosition);
      float sun = pow(max(dot(V, sunDir), 0.0), 4.0);
      vAlpha = (0.06 + 0.9 * sun) * (0.6 + 0.4 * sin(time * 1.3 + seed.x * 40.0));
      vColor = vec3(1.0, 0.86, 0.6);`,
    /* glsl */`gl_FragColor = vec4(vColor, smoothstep(0.5, 0.0, r) * vAlpha);`,
    { boxMin: { value: new THREE.Vector3(-22, 53, -48) }, boxSize: { value: new THREE.Vector3(44, 14, 40) } });

  // --- fireflies drifting around the camp and the bushes, blinking softly ---
  particles(18, `uniform vec3 boxMin, boxSize;`, /* glsl */`
      vec3 c = boxMin + seed.xyz * boxSize;
      float ph = seed.w * 6.2831;
      vec3 p = c + vec3(sin(time * (0.21 + seed.x * 0.2) + ph) * 1.4,
                        sin(time * (0.33 + seed.y * 0.2) + ph * 2.0) * 0.5,
                        cos(time * (0.17 + seed.z * 0.2) + ph) * 1.2);
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      mv.xy += windAtClip(projectionMatrix * mv) * 1.2;   // blown by the pointer
      gl_Position = projectionMatrix * mv;
      float blink = pow(max(sin(time * (0.7 + seed.y) + ph * 3.0), 0.0), 4.0);
      gl_PointSize = (0.05 + 0.04 * blink) * pointScale / -mv.z;
      vAlpha = 0.15 + 0.85 * blink;
      vColor = vec3(0.85, 1.0, 0.45) * 3.0;               // HDR so bloom picks them up`,
    /* glsl */`gl_FragColor = vec4(vColor, smoothstep(0.5, 0.05, r) * vAlpha);`,
    { boxMin: { value: new THREE.Vector3(-13, 56.5, -27) }, boxSize: { value: new THREE.Vector3(15, 3.5, 13) } });

  // --- 28. waterfall spray: droplets thrown up and out where the fall hits the pool ---
  particles(140, `uniform vec3 base;`, /* glsl */`
      float life = fract(time * (0.45 + seed.x * 0.35) + seed.y);
      float ang = seed.z * 6.2831;
      vec3 vel = vec3(cos(ang) * (0.4 + seed.w), 2.2 + seed.x * 2.0, sin(ang) * (0.4 + seed.w) + 0.5); // high enough to rise above the boulder
      vec3 p = base + vec3(cos(ang), 0.0, sin(ang)) * 0.25 + vel * life + vec3(0.0, -1.4, 0.0) * life * life;
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      mv.xy += windAtClip(projectionMatrix * mv) * 1.2;   // blown by the pointer
      gl_Position = projectionMatrix * mv;
      gl_PointSize = mix(0.04, 0.22, life) * pointScale / -mv.z;
      vAlpha = (1.0 - life) * smoothstep(0.0, 0.08, life) * 0.5;
      vec3 V = normalize(p - cameraPosition);
      vColor = vec3(1.0, 0.95, 0.85) * (0.6 + 1.2 * pow(max(dot(V, sunDir), 0.0), 4.0));`,
    /* glsl */`gl_FragColor = vec4(vColor, smoothstep(0.5, 0.1, r) * vAlpha);`,
    { base: { value: fallBase.clone() } });

  // a soft cloud of mist hanging over the splash, breathing slowly
  const splash = new THREE.Sprite(new THREE.SpriteMaterial({ map: puffTex[0], color: col('#fff3d6'), transparent: true, depthWrite: false, fog: false, opacity: 0.35 }));
  splash.position.copy(fallBase).add(new THREE.Vector3(0.3, 3.0, 0.6));
  splash.renderOrder = 4;
  group.add(splash);
  updaters.push(t => {
    const b = 0.5 + 0.5 * Math.sin(t * 0.9);
    splash.material.opacity = (0.3 + 0.1 * b) * atmoMix.value;
    splash.scale.set(4.2 + 0.5 * b, 2.4 + 0.4 * b, 1);
  });

  return group;
}

// ================= Baked sunlight for the far landscape =================
// The valley is far too big for a shadow map, so sun visibility is baked per sun position: from every terrain vertex
// (and every tree) march towards the key light over a height grid of the terrain plus the cliffs and pillars, keeping a
// soft penumbra from the closest miss. It only dims direct sunlight, so shaded slopes still get the cool sky light.
const GRID = { x0: -1200, z0: -80, step: 5, nx: 481, nz: 245 };
const heightGrid = new Float32Array(GRID.nx * GRID.nz).fill(-50);
let gridMax = 0;

function buildHeightGrid(terrainMeshes, masses) {
  const p = new THREE.Vector3();
  const put = (x, y, z) => {
    const ix = Math.round((x - GRID.x0) / GRID.step), iz = Math.round((GRID.z0 - z) / GRID.step);
    if (ix < 0 || ix >= GRID.nx || iz < 0 || iz >= GRID.nz) return;
    const i = iz * GRID.nx + ix;
    if (y > heightGrid[i]) heightGrid[i] = y;
    if (y > gridMax) gridMax = y;
  };
  for (const t of terrainMeshes) {
    const pos = t.geometry.attributes.position;
    for (let i = 0; i < pos.count; i++) put(pos.getX(i), pos.getY(i), pos.getZ(i));
  }
  for (const m of masses) {
    const pos = m.geometry.attributes.position;
    for (let i = 0; i < pos.count; i++) { p.fromBufferAttribute(pos, i).add(m.position); put(p.x, p.y, p.z); }
  }
}

function gridHeight(x, z) {
  const fx = (x - GRID.x0) / GRID.step, fz = (GRID.z0 - z) / GRID.step;
  if (fx < 0 || fz < 0 || fx >= GRID.nx - 1 || fz >= GRID.nz - 1) return null;
  const ix = fx | 0, iz = fz | 0, tx = fx - ix, tz = fz - iz, i = iz * GRID.nx + ix;
  return (heightGrid[i] * (1 - tx) + heightGrid[i + 1] * tx) * (1 - tz) + (heightGrid[i + GRID.nx] * (1 - tx) + heightGrid[i + GRID.nx + 1] * tx) * tz;
}

function sunVisAt(x, y, z, dx, dz, rise) {
  let vis = 1;
  for (let t = 4; t < 1400; t += 5 + t * 0.01) {
    const ry = y + 0.8 + rise * t;
    if (ry > gridMax) break;
    const gh = gridHeight(x + dx * t, z + dz * t);
    if (gh === null) break;
    vis = Math.min(vis, (ry - gh) / (0.04 * t + 1.0));       // closest miss -> soft penumbra
    if (vis <= 0) return 0;
  }
  return smooth(0, 1, vis);
}

function bakeSunlight() {
  const t0 = performance.now();
  const hlen = Math.hypot(keyDir.x, keyDir.z), dx = keyDir.x / hlen, dz = keyDir.z / hlen, rise = keyDir.y / hlen;
  for (const t of terrains) {
    const pos = t.geometry.attributes.position, attr = t.geometry.attributes.sunVis;
    for (let i = 0; i < pos.count; i++) attr.array[i] = sunVisAt(pos.getX(i), pos.getY(i), pos.getZ(i), dx, dz, rise);
    attr.needsUpdate = true;
  }
  const m = new THREE.Matrix4();
  scene.traverse(o => {
    if (!o.isInstancedMesh || !o.userData.bake) return;
    const attr = o.geometry.attributes.sunVis;
    for (let i = 0; i < o.count; i++) {
      o.getMatrixAt(i, m);
      const e = m.elements;
      attr.array[i] = sunVisAt(e[12], e[13] + 2.5, e[14], dx, dz, rise);
    }
    attr.needsUpdate = true;
  });
  console.log(`sunlight baked in ${(performance.now() - t0).toFixed(0)} ms`);
}

// ================= Light shafts =================
// Soft beams of sunlight slanting down through the haze (the bear-forest and Nexora references), plus a few small ones
// falling through the canopy onto the camp. Each beam is two crossed planes stretched along the key light.
const shaftUniforms = { color: { value: col('#f2cf96') }, sunFactor: { value: 1 } };
let shaftGroup = null;
function buildLightShafts(parent) {
  if (shaftGroup) { // rebuilt when the sun moves: dispose the old beams
    shaftGroup.traverse(o => { if (o.isMesh) { o.geometry.dispose(); o.material.dispose(); } });
    parent.remove(shaftGroup);
  }
  shaftGroup = new THREE.Group();
  parent.add(shaftGroup);
  // lower sun = longer, stronger beams; high sun = barely there
  shaftUniforms.sunFactor.value = THREE.MathUtils.clamp(1.3 - THREE.MathUtils.radToDeg(Math.asin(sunDir.y)) / 12, 0.35, 1.1);
  const axis = keyDir.clone().negate();                      // from the sky down towards the camera side
  const makeShaft = (target, length, width, opacity, nearFade, seed) => {
    const start = target.clone().addScaledVector(axis, -length * 0.62);
    {
      const side = new THREE.Vector3().crossVectors(axis, new THREE.Vector3(0, 60, 0).sub(target)).normalize(); // face the camera's resting spot
      const pos = [], uv = [], idx = [];
      const SEG = 8;
      for (let j = 0; j <= SEG; j++) {
        const v = j / SEG, w = width * THREE.MathUtils.lerp(0.6, 1.4, v) / 2;
        const p = start.clone().addScaledVector(axis, v * length);
        pos.push(p.x - side.x * w, p.y - side.y * w, p.z - side.z * w, p.x + side.x * w, p.y + side.y * w, p.z + side.z * w);
        uv.push(0, v, 1, v);
        if (j < SEG) { const a = j * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
      geo.setIndex(idx);
      const mesh = new THREE.Mesh(geo, new THREE.ShaderMaterial({
        transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
        uniforms: { ...shaftUniforms, time: skyUniforms.time, fogIntro: mistUniforms.fogIntro, atmoMix,
          opacity: { value: opacity }, seed: { value: seed }, nearFade: { value: new THREE.Vector2(...nearFade) } },
        vertexShader: /* glsl */`
          varying vec2 vUv;
          varying vec3 vWorld;
          void main() {
            vUv = uv;
            vWorld = (modelMatrix * vec4(position, 1.0)).xyz;
            gl_Position = projectionMatrix * viewMatrix * vec4(vWorld, 1.0);
          }`,
        fragmentShader: NOISE_GLSL + /* glsl */`
          uniform vec3 color;
          uniform float time, opacity, seed, fogIntro, atmoMix, sunFactor;
          uniform vec2 nearFade;
          varying vec2 vUv;
          varying vec3 vWorld;
          void main() {
            float across = abs(vUv.x - 0.5) * 2.0;
            float soft = exp(-across * across * 3.5);
            float along = smoothstep(0.0, 0.2, vUv.y) * (1.0 - smoothstep(0.5, 1.0, vUv.y));
            float streak = 0.5 + 0.5 * nNoise(vec2(vUv.x * 6.0 + seed, vUv.y * 1.6 - time * 0.03));
            float shimmer = 0.85 + 0.15 * sin(time * 0.4 + seed * 3.0);
            float d = length(vWorld - cameraPosition);
            float a = soft * along * streak * shimmer * opacity * smoothstep(nearFade.x, nearFade.y, d) * (1.0 - 0.8 * fogIntro);
            gl_FragColor = vec4(color, a * atmoMix * sunFactor);
          }`,
      }));
      mesh.renderOrder = 6;
      mesh.frustumCulled = false;
      shaftGroup.add(mesh);
    }
  };
  const rand = mulberry32(73);
  // big beams over the valley
  for (const [x, y, z] of [[80, 25, -520], [140, 20, -420], [-20, 20, -560], [40, 15, -300]]) { // localised, mostly sun-side
    makeShaft(new THREE.Vector3(x, y, z), 260 + rand() * 80, 30 + rand() * 40, 0.018 + rand() * 0.022, [80, 220], rand() * 10);
  }
  // small beams falling through the canopy onto the camp
  for (const [x, z] of [[-0.8, -20], [-5.6, -23]]) {
    makeShaft(new THREE.Vector3(x, 57.4, z), 24, 0.7 + rand() * 0.9, 0.07 + rand() * 0.04, [4, 11], rand() * 10);
  }
}

// ================= The wisp =================
// A small glowing light that follows the pointer with a little lag and leaves a fading trail: the interaction element
// from the concept board. It is a real light, so it warms the leaves, bark and rocks it passes, and it is where the wind
// comes from. With no pointer it idles near the camp.
function buildWisp() {
  const group = new THREE.Group();
  scene.add(group);
  const tex = glowTexture();
  const core = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, color: new THREE.Color(1, 0.86, 0.56).multiplyScalar(4),
    blending: THREE.AdditiveBlending, transparent: true, depthWrite: false, fog: false }));
  const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, color: col('#ffb24a'), blending: THREE.AdditiveBlending,
    transparent: true, depthWrite: false, fog: false, opacity: 0.45 }));
  halo.scale.setScalar(1.5);
  const light = new THREE.PointLight(col('#ffc070'), 0, 9, 1.4);
  group.add(core, halo, light);

  const TRAIL = 48;
  const trailPos = new Float32Array(TRAIL * 3), age = new Float32Array(TRAIL);
  for (let i = 0; i < TRAIL; i++) age[i] = i / (TRAIL - 1);
  const trailGeo = new THREE.BufferGeometry();
  trailGeo.setAttribute('position', new THREE.BufferAttribute(trailPos, 3));
  trailGeo.setAttribute('age', new THREE.BufferAttribute(age, 1));
  const trail = new THREE.Points(trailGeo, new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    uniforms: { pointScale: particleUniforms.pointScale },
    vertexShader: /* glsl */`
      attribute float age;
      uniform float pointScale;
      varying float vAlpha;
      void main() {
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_Position = projectionMatrix * mv;
        gl_PointSize = mix(0.09, 0.012, age) * pointScale / -mv.z;
        vAlpha = pow(1.0 - age, 2.0) * 0.85;
      }`,
    fragmentShader: /* glsl */`
      varying float vAlpha;
      void main() {
        float r = length(gl_PointCoord - 0.5);
        gl_FragColor = vec4(vec3(1.0, 0.78, 0.42) * 2.5, smoothstep(0.5, 0.0, r) * vAlpha);
      }`,
  }));
  trail.frustumCulled = false;
  trail.renderOrder = 7;
  scene.add(trail);

  const pos = new THREE.Vector3(-1, 58.6, -12), vel = new THREE.Vector3(), target = new THREE.Vector3(), dir = new THREE.Vector3();
  for (let i = 0; i < TRAIL; i++) trailPos.set([pos.x, pos.y, pos.z], i * 3);
  let last = 0, appear = 0;
  updaters.push(t => {
    const dt = Math.min(t - last, 0.05);
    last = t;
    appear = Math.min(appear + dt * 0.4, 1);
    const nx = pointer.seen ? pointer.x * 2 - 1 : -0.1 + 0.12 * Math.sin(t * 0.31);
    const ny = pointer.seen ? pointer.y * 2 - 1 : -0.05 + 0.08 * Math.sin(t * 0.43);
    dir.set(nx, ny, 0.5).unproject(camera).sub(camera.position).normalize();
    target.copy(camera.position).addScaledVector(dir, 12).add(new THREE.Vector3(Math.sin(t * 2.1) * 0.06, Math.sin(t * 1.7) * 0.08, 0));
    vel.addScaledVector(target.clone().sub(pos), 10 * dt).multiplyScalar(Math.exp(-6 * dt)); // springy follow
    pos.addScaledVector(vel, dt);
    group.position.copy(pos);
    const pulse = 0.9 + 0.1 * Math.sin(t * 9.0) * Math.sin(t * 3.3);
    core.scale.setScalar(0.24 * pulse);
    light.intensity = 2.2 * pulse * appear;
    halo.material.opacity = 0.28 * pulse * appear;
    core.material.opacity = appear;
    trailPos.copyWithin(3, 0, (TRAIL - 1) * 3);                  // shift the trail back one slot
    trailPos.set([pos.x, pos.y, pos.z], 0);
    trailGeo.attributes.position.needsUpdate = true;
  });
}

// ================= Post-processing: light rays, bloom, tone mapping, grading =================
const RAYS_VERTEX = 'varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }';
class RaysPass extends Pass {
  constructor() {
    super();
    this.rt = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType });
    this.uniforms = { tDiffuse: { value: null }, sunPos: { value: new THREE.Vector2(0.8, 0.6) }, strength: { value: 0.9 }, rayColor: { value: col('#ffd38c') } };
    this.rayQuad = new FullScreenQuad(new THREE.ShaderMaterial({
      uniforms: this.uniforms, depthTest: false, depthWrite: false, vertexShader: RAYS_VERTEX,
      fragmentShader: /* glsl */`
        uniform sampler2D tDiffuse; uniform vec2 sunPos; uniform float strength; uniform vec3 rayColor;
        varying vec2 vUv;
        void main() {
          vec2 delta = (vUv - sunPos) / 40.0 * 0.92;
          vec2 uv = vUv;
          float illum = 1.0, acc = 0.0;
          for (int i = 0; i < 40; i++) {
            uv -= delta;
            vec3 s = texture2D(tDiffuse, clamp(uv, 0.0, 1.0)).rgb;
            acc += max(dot(s, vec3(0.2126, 0.7152, 0.0722)) - 1.4, 0.0) * illum; // only bright sky/sun pixels emit rays
            illum *= 0.945;
          }
          gl_FragColor = vec4(rayColor * (acc / 40.0) * strength, 1.0);
        }`,
    }));
    this.compQuad = new FullScreenQuad(new THREE.ShaderMaterial({
      uniforms: { tDiffuse: { value: null }, tRays: { value: null } }, depthTest: false, depthWrite: false, vertexShader: RAYS_VERTEX,
      fragmentShader: 'uniform sampler2D tDiffuse, tRays; varying vec2 vUv; void main() { gl_FragColor = vec4(texture2D(tDiffuse, vUv).rgb + texture2D(tRays, vUv).rgb, 1.0); }',
    }));
  }
  setSize(w, h) { this.rt.setSize(Math.max(1, w >> 1), Math.max(1, h >> 1)); }
  render(renderer, writeBuffer, readBuffer) {
    this.uniforms.tDiffuse.value = readBuffer.texture;
    renderer.setRenderTarget(this.rt);
    this.rayQuad.render(renderer);
    this.compQuad.material.uniforms.tDiffuse.value = readBuffer.texture;
    this.compQuad.material.uniforms.tRays.value = this.rt.texture;
    renderer.setRenderTarget(this.renderToScreen ? null : writeBuffer);
    this.compQuad.render(renderer);
  }
}

const GradeShader = {
  uniforms: { tDiffuse: { value: null }, time: { value: 0 }, aspect: { value: innerWidth / innerHeight },
    texel: { value: new THREE.Vector2(1 / innerWidth, 1 / innerHeight) }, focusUv: { value: new THREE.Vector2(0.5, 0.5) }, duo: { value: 0 }, ink: { value: 0 },
    tDepth: { value: null }, cameraNear: { value: 0.5 }, cameraFar: { value: 4000 } },
  vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: /* glsl */`
    uniform sampler2D tDiffuse; uniform float time, aspect, duo, ink, cameraNear, cameraFar; uniform sampler2D tDepth; uniform vec2 texel, focusUv;
    varying vec2 vUv;
    float hash(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
    float lumAt(vec2 uv) { return dot(texture2D(tDiffuse, uv).rgb, vec3(0.299, 0.587, 0.114)); }
    float vnoise(vec2 p) { vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
      return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), f.x), f.y); }
    // ---- pen-and-ink illustration ----
    float viewZ(vec2 uv) { return texture2D(tDepth, uv).x * cameraFar; }
    // one layer of hatching: parallel strokes broken into dashes of random length, each tapered at both ends
    float strokes(vec2 px, float ang, float spacing, float coverage, float seed) {
      vec2 r = mat2(cos(ang), -sin(ang), sin(ang), cos(ang)) * px;
      float row = floor(r.y / spacing);
      float fy = fract(r.y / spacing) - 0.5 + (hash(vec2(row, seed)) - 0.5) * 0.25;
      float len = 14.0 + 26.0 * hash(vec2(row, seed + 1.0));
      float u = r.x / len + hash(vec2(row, seed + 2.0)) * 7.0;
      float seg = floor(u), fx = fract(u);
      float on = step(hash(vec2(row * 1.7 + seg, seed + 3.0)), coverage);
      float taper = sin(3.14159 * clamp((fx - 0.08) / 0.84, 0.0, 1.0));
      float w = 0.07 + 0.11 * taper;                                    // hairline strokes, fattest in the middle
      return on * taper * smoothstep(w, w * 0.4, abs(fy));
    }
    vec3 inkStyle(vec2 uv) {
      vec2 px = uv / texel;
      // a faint hand wobble, so lines are drawn rather than computed
      vec2 wob = (vec2(vnoise(px * 0.02), vnoise(px * 0.02 + 17.0)) - 0.5) * texel * 1.6;
      vec2 q = uv + wob;
      float z = viewZ(q);
      float far = smoothstep(40.0, 900.0, z);                          // 0 at the camp, 1 at the far ranges
      bool sky = z > cameraFar * 0.9;

      // lines: depth silhouettes and creases, one pixel wide
      vec2 o = texel * mix(1.0, 0.75, far);
      float zl = viewZ(q - vec2(o.x, 0.0)), zr = viewZ(q + vec2(o.x, 0.0));
      float zd = viewZ(q - vec2(0.0, o.y)), zu = viewZ(q + vec2(0.0, o.y));
      float sil = max(max(abs(zl - z), abs(zr - z)), max(abs(zd - z), abs(zu - z))) / z;
      float crease = abs(zl + zr + zd + zu - 4.0 * z) / z;
      float line = max(smoothstep(0.035, 0.09, sil), smoothstep(0.015, 0.05, crease) * 0.35);
      // a few interior lines from strong tone breaks (rock fractures, the tarp's fold, cloud edges), kept light
      float l = dot(texture2D(tDiffuse, q).rgb, vec3(0.299, 0.587, 0.114));
      float gx = dot(texture2D(tDiffuse, q + vec2(o.x, 0.0)).rgb - texture2D(tDiffuse, q - vec2(o.x, 0.0)).rgb, vec3(0.333));
      float gy = dot(texture2D(tDiffuse, q + vec2(0.0, o.y)).rgb - texture2D(tDiffuse, q - vec2(0.0, o.y)).rgb, vec3(0.333));
      float toneEdge = smoothstep(sky ? 0.035 : 0.11, sky ? 0.08 : 0.22, length(vec2(gx, gy)));
      line = max(line, toneEdge * (sky ? 0.45 : 0.4));
      line *= mix(1.0, 0.5, far) * (0.8 + 0.2 * vnoise(px * 0.15));    // the pen lightens with distance and skips a little

      // shading: how dark this spot is, simplified, and faded to paper with distance
      float t = clamp(pow(l, 0.75) * 1.2, 0.0, 1.0);
      float shade = (1.0 - smoothstep(0.12, 0.66, t)) * (1.0 - 0.6 * far);
      if (sky) shade = 0.0;
      // hatching: strokes turn slowly across the picture, and a second layer crosses the darkest areas
      float ang = 0.95 + 0.5 * (vnoise(px * 0.004 + 3.0) - 0.5);
      float h = strokes(px, ang, 4.6, smoothstep(0.3, 0.75, shade), 1.0);
      h = max(h, strokes(px, ang - 1.25, 5.2, smoothstep(0.72, 0.95, shade), 9.0));

      // paper, a soft grey wash under the hatching, then the ink
      vec3 paper = vec3(0.905, 0.905, 0.89) * (0.97 + 0.05 * vnoise(px * 0.7));   // paper tooth
      float wash = 1.0 - 0.24 * smoothstep(0.1, 0.8, shade) - (sky ? 0.04 * (1.0 - t) : 0.18 * far * (1.0 - t));
      vec3 col = paper * wash;
      vec3 ink = vec3(0.1, 0.1, 0.095);
      col = mix(col, ink, clamp(h * 0.62 + line * 0.92, 0.0, 1.0));
      return col;
    }
    void main() {
      if (ink > 0.5) { gl_FragColor = vec4(inkStyle(vUv) + (hash(vUv * 1000.0) - 0.5) * 0.03, 1.0); return; }
      // no sharpening: FXAA alone keeps edges clean, and the image stays soft and painterly rather than crunchy
      vec3 c = texture2D(tDiffuse, vUv).rgb;
      float l = dot(c, vec3(0.299, 0.587, 0.114));
      // cinematic split: shadows lean teal-blue, highlights lean gold (the warm/cool contrast in every reference)
      c *= mix(vec3(0.96, 1.0, 1.03), vec3(1.05, 1.0, 0.93), smoothstep(0.08, 0.8, l)); // cool shade, golden light
      // blacks lift towards deep teal-green instead of grey, like painted shadows
      c += vec3(0.010, 0.026, 0.030) * (1.0 - smoothstep(0.0, 0.35, l));
      // a gentle S-curve, and a slight lift of the darkest values, so tones roll into each other softly
      c = clamp(c, 0.0, 1.0);
      c = mix(c, c * c * (3.0 - 2.0 * c), 0.1);
      c = c * 0.97 + 0.02;
      // richer midtones
      float l2 = dot(c, vec3(0.299, 0.587, 0.114));
      c = max(mix(vec3(l2), c, 1.06), 0.0);
      // vignette: darker edges frame the bright centre
      vec2 d = vUv - mix(vec2(0.5), focusUv, 0.3); d.x *= aspect;
      c *= mix(0.84, 1.0, smoothstep(1.15, 0.35, length(d)));
      // duotone (the home page's editorial plate): ink to paper by brightness, a touch of the accent red in the warm light
      if (duo > 0.0) {
        float lum = smoothstep(0.04, 0.92, dot(c, vec3(0.299, 0.587, 0.114)));
        vec3 plate = mix(vec3(0.059, 0.055, 0.047), vec3(0.973, 0.961, 0.925), lum);
        plate = mix(plate, vec3(0.71, 0.24, 0.13), 0.1 * smoothstep(0.55, 0.0, abs(lum - 0.62) * 2.2) * smoothstep(0.0, 0.25, c.r - c.b));
        c = mix(c, plate, duo);
      }
      // film grain (also hides gradient banding); heavier on the duotone plate, like print
      c += (hash(vUv * 1000.0 + fract(time) * 100.0) - 0.5) * mix(0.018, 0.05, duo);
      gl_FragColor = vec4(c, 1.0);
    }`,
};

// ---------- depth of field: very near things (corner bushes, nearest trunk) go soft, like a lens focused on the camp ----------
class DOFPass extends Pass {
  constructor() {
    super();
    this.material = new THREE.ShaderMaterial({
      depthTest: false,
      depthWrite: false,
      uniforms: { tColor: { value: null }, tDepth: { value: null }, cameraNear: { value: camera.near }, cameraFar: { value: camera.far },
        resolution: { value: new THREE.Vector2(1, 1) }, focusNear: { value: 11 }, blurNear: { value: 4.5 }, maxRadius: { value: 9 } },
      vertexShader: 'varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
      fragmentShader: /* glsl */`
        uniform sampler2D tColor, tDepth;
        uniform float cameraNear, cameraFar, focusNear, blurNear, maxRadius;
        uniform vec2 resolution;
        varying vec2 vUv;
        float viewZ(vec2 uv) {
          float z = texture2D(tDepth, uv).x * 2.0 - 1.0;
          return 2.0 * cameraNear * cameraFar / (cameraFar + cameraNear - z * (cameraFar - cameraNear));
        }
        float coc(float z) { return smoothstep(focusNear, blurNear, z); } // 1 = fully blurred (close), 0 = sharp
        void main() {
          vec3 acc = texture2D(tColor, vUv).rgb;
          float cz = viewZ(vUv), cc = coc(cz), wsum = 1.0;
          vec2 px = 1.0 / resolution;
          float probe = cc;
          for (int k = 0; k < 6; k++) { float a = float(k) * 1.0472; probe = max(probe, coc(viewZ(vUv + vec2(cos(a), sin(a)) * maxRadius * px))); }
          if (probe < 0.01) { gl_FragColor = vec4(acc, 1.0); return; }
          for (int i = 1; i <= 28; i++) {
            float r = sqrt(float(i) / 28.0) * maxRadius;
            float a = float(i) * 2.39996;                         // golden-angle spiral
            vec2 uv = vUv + vec2(cos(a), sin(a)) * r * px;
            float sz = viewZ(uv), sc = coc(sz);
            // a sample counts if its own blur reaches this pixel (near things spread over what is behind them),
            // or if this pixel is blurred and the sample is not far behind it (no background bleeding into the blur)
            float reach = max(sc, cc * step(sz, cz + 2.0)) * maxRadius;
            float w = smoothstep(r - 1.0, r + 0.5, reach);
            acc += texture2D(tColor, uv).rgb * w;
            wsum += w;
          }
          gl_FragColor = vec4(acc / wsum, 1.0);
        }`,
    });
    this.fsQuad = new FullScreenQuad(this.material);
    if (INK) {
      this.depthTarget = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, depthBuffer: false });
      this.depthQuad = new FullScreenQuad(new THREE.ShaderMaterial({
        depthTest: false, depthWrite: false,
        uniforms: { tDepth: { value: null }, cameraNear: { value: camera.near }, cameraFar: { value: camera.far } },
        vertexShader: 'varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
        fragmentShader: `uniform sampler2D tDepth; uniform float cameraNear, cameraFar; varying vec2 vUv;
          void main() { float z = texture2D(tDepth, vUv).x * 2.0 - 1.0;
            float v = 2.0 * cameraNear * cameraFar / (cameraFar + cameraNear - z * (cameraFar - cameraNear));
            gl_FragColor = vec4(v / cameraFar, 0.0, 0.0, 1.0); }`,
      }));
    }
  }
  render(renderer, writeBuffer, readBuffer) {
    if (INK) {
      if (this.depthTarget.width !== readBuffer.width || this.depthTarget.height !== readBuffer.height) this.depthTarget.setSize(readBuffer.width, readBuffer.height);
      this.depthQuad.material.uniforms.tDepth.value = readBuffer.depthTexture;
      renderer.setRenderTarget(this.depthTarget);
      this.depthQuad.render(renderer);
      gradePass.uniforms.tDepth.value = this.depthTarget.texture;
    }
    const u = this.material.uniforms;
    u.tColor.value = readBuffer.texture;
    u.tDepth.value = readBuffer.depthTexture;
    u.resolution.value.set(readBuffer.width, readBuffer.height);
    u.maxRadius.value = INK ? 0 : 6 * readBuffer.height / 1080;
    renderer.setRenderTarget(this.renderToScreen ? null : writeBuffer);
    this.fsQuad.render(renderer);
  }
}

// The scene renders into a multisampled HDR target that keeps its depth, so the depth of field can read it.
const rtSize = renderer.getDrawingBufferSize(new THREE.Vector2());
const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(rtSize.x, rtSize.y, {
  type: THREE.HalfFloatType, depthTexture: new THREE.DepthTexture(rtSize.x, rtSize.y),
}));
// the second buffer needs its own depth texture: a clone would share the GPU texture and the DOF pass would read the depth
// it is writing into (a feedback loop)
composer.renderTarget2.depthTexture = new THREE.DepthTexture(rtSize.x, rtSize.y);
composer.addPass(new RenderPass(scene, camera));
const dofPass = new DOFPass();
composer.addPass(dofPass);
const raysPass = new RaysPass();
composer.addPass(raysPass);
const bloomPass = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.32, 0.8, 1.35);
composer.addPass(bloomPass);
composer.addPass(new OutputPass());
const fxaaPass = new ShaderPass(FXAAShader);
composer.addPass(fxaaPass);
const gradePass = new ShaderPass(GradeShader);
if (DUOTONE) gradePass.uniforms.duo.value = 1;
if (INK) {
  // line work only: no glows, no blur; the grade pass reads the scene's depth for its outlines
  gradePass.uniforms.ink.value = 1;
  gradePass.uniforms.cameraNear.value = camera.near;
  gradePass.uniforms.cameraFar.value = camera.far;
  bloomPass.enabled = false;
  raysPass.enabled = false;
}
composer.addPass(gradePass);
composer.setSize(innerWidth, innerHeight);
const setFxaaSize = () => {
  fxaaPass.material.uniforms.resolution.value.set(1 / (innerWidth * renderer.getPixelRatio()), 1 / (innerHeight * renderer.getPixelRatio()));
  gradePass.uniforms.texel.value.copy(fxaaPass.material.uniforms.resolution.value);
};
setFxaaSize();

// ---- adaptive resolution: keep the frame rate smooth on slower machines by trading a little sharpness ----
const MAX_PR = Math.min(devicePixelRatio, 1.5);
const MIN_PR = Math.min(devicePixelRatio, 1);       // never render below the screen's own pixel grid: that is what looked blurry
let frameBudget = { time: 0, frames: 0 }, lightweight = false;
// on a slow machine, drop the most expensive atmosphere first (upper fog layers, valley beams, dust) and keep it sharp
function goLightweight() {
  if (lightweight) return;
  lightweight = true;
  atmosphere.traverse(o => {
    const u = o.material && o.material.uniforms;
    if (!u) return;
    if (u.alpha && u.seed && u.seed.value > 10) o.visible = false;           // fog sheets above the third layer
    if (u.nearFade && u.nearFade.value.x > 50) o.visible = false;           // big valley beams
    if (o.isPoints && o.geometry.attributes.position.count > 400) o.visible = false; // dust motes
  });
}
function adaptResolution(dt) {
  if (dt > 0.25 || document.hidden || lastT - introStart < 6) return; // start-up stalls and throttled tabs say nothing about GPU load
  frameBudget.time += dt;
  frameBudget.frames++;
  if (frameBudget.time < 1.5 || frameBudget.frames < 30) return;
  const avg = frameBudget.time / frameBudget.frames;
  frameBudget = { time: 0, frames: 0 };
  const pr = renderer.getPixelRatio();
  let next = pr;
  if (avg > 1 / 40 && pr > MIN_PR) next = Math.max(MIN_PR, pr * 0.9);
  else if (avg > 1 / 40) goLightweight();
  else if (avg < 1 / 58 && pr < MAX_PR) next = Math.min(MAX_PR, pr * 1.08);
  if (Math.abs(next - pr) < 0.01) return;
  renderer.setPixelRatio(next);
  composer.setPixelRatio(next);
  composer.setSize(innerWidth, innerHeight);
  renderer.getDrawingBufferSize(drawSize);
  setFxaaSize();
  particleUniforms.pointScale.value = pointScale();
}

// The layout was composed for 16:9. Narrower screens widen the vertical field of view (up to a limit) to keep the
// same horizontal coverage, and very tall screens also pan a little towards the camp and waterfall corridor.
let framingShiftX = 0, framingShiftY = 0;
function frameCamera() {
  const a = innerWidth / innerHeight, BASE_ASPECT = 16 / 9, BASE_FOV = 42;
  const halfW = Math.tan(THREE.MathUtils.degToRad(BASE_FOV / 2)) * BASE_ASPECT;
  camera.aspect = a;
  camera.fov = a < BASE_ASPECT ? Math.min(2 * THREE.MathUtils.radToDeg(Math.atan(halfW / a)), 54) : BASE_FOV;
  const tall = 1 - THREE.MathUtils.clamp((a - 0.45) / 0.85, 0, 1);   // 1 on a phone held upright, 0 from roughly square up
  framingShiftX = -9 * tall;   // pan towards the camp and waterfall
  framingShiftY = 10 * tall;   // tilt up so the bottom edge sits where it does on desktop, not on the rocks underneath
  camera.updateProjectionMatrix();
  if (typeof particleUniforms !== 'undefined') particleUniforms.pointScale.value = pointScale();
}

  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);

  gradePass.uniforms.aspect.value = innerWidth / innerHeight;
  particleUniforms.pointScale.value = pointScale();

// ================= Loop =================
const clock = new THREE.Clock();
const sunScreen = new THREE.Vector3(), heroPos = new THREE.Vector3();
// Scroll path: from the ledge, forward under the canopy (leaves sweep overhead), past the camp,
// out over the edge and down into the misty valley.
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
const camPath = new THREE.CatmullRomCurve3([V3(0, 60, 0), V3(0.4, 61.6, -8), V3(1.2, 62.2, -16), V3(2.2, 60.5, -30), V3(5, 52, -52), V3(8, 44, -78)]);
const lookPath = new THREE.CatmullRomCurve3([V3(0, 52, -100), V3(1, 50, -110), V3(3, 46, -130), V3(7, 34, -150), V3(12, 22, -170), V3(18, 12, -200)]);
const camPos = new THREE.Vector3(), camLook = new THREE.Vector3(), camOff = new THREE.Vector2();
const track = document.getElementById('track');
const easeOutCubic = x => 1 - Math.pow(1 - x, 3);
const easeInOutSine = x => -(Math.cos(Math.PI * x) - 1) / 2;
let lastT = 0, frameCount = 0, introStart = -1, scrollP = 0, heroVisible = true;
new IntersectionObserver(([e]) => { heroVisible = e.isIntersecting; }).observe(track); // stop rendering once scrolled past

renderer.setAnimationLoop(() => {
  const t = clock.getElapsedTime(), rawDt = t - lastT, dt = Math.min(rawDt, 0.1);
  lastT = t;
  if ((EMBED ? !embedState.visible : !heroVisible) && introStart >= 0) return;
  if (introStart >= 0) adaptResolution(rawDt);

  // intro: begins once the first frames are on screen (shaders compiled), then the curtain lifts and the fog burns off
  if (introStart < 0 && ++frameCount === 3) {
    introStart = t;
    document.body.classList.add('ready');
    if (EMBED) parent.postMessage({ source: 'scene', ready: true }, location.origin);
  }
  const ip = introStart < 0 ? 0 : Math.min((t - introStart) / 5, 1);
  const intro = 1 - easeOutCubic(ip);
  mistUniforms.fogIntro.value = Math.pow(intro, 1.2);
  renderer.toneMappingExposure = 0.9 * (0.6 + 0.4 * easeOutCubic(Math.min(ip * 1.4, 1)));

  // scroll progress through the hero track, smoothed so the camera glides
  const raw = EMBED ? embedState.scroll : THREE.MathUtils.clamp(scrollY / Math.max(track.offsetHeight - innerHeight, 1), 0, 1);
  scrollP += (raw - scrollP) * Math.min(dt * 4, 1);
  const sp = easeInOutSine(scrollP);
  camPath.getPointAt(sp, camPos);
  lookPath.getPointAt(sp, camLook);
  camPos.z += 7 * intro;                 // intro: a slow dolly in from a little further back and higher
  camPos.y += 1.6 * intro;

  // parallax: the camera leans a little towards the pointer and drifts slowly on its own; calmer while diving in
  const tx = pointer.seen ? pointer.x - 0.5 : 0, ty = pointer.seen ? pointer.y - 0.5 : 0;
  camOff.x += (tx - camOff.x) * Math.min(dt * 2.5, 1);
  camOff.y += (ty - camOff.y) * Math.min(dt * 2.5, 1);
  const par = REDUCED_MOTION ? 0 : 1 - 0.7 * sp;
  camera.position.set(camPos.x + (camOff.x * 0.7 + Math.sin(t * 0.13) * 0.12) * par, camPos.y + (camOff.y * 0.3 + Math.sin(t * 0.17) * 0.06) * par, camPos.z);
  camera.lookAt(camLook.x + framingShiftX + camOff.x * 4 * par, camLook.y + framingShiftY + camOff.y * 2 * par, camLook.z);
  camera.updateMatrixWorld();


  updateWind(dt);
  for (const update of updaters) update(t);
  skyUniforms.time.value = t;
  mistUniforms.fogTime.value = t;
  gradePass.uniforms.time.value = t;
  sky.position.copy(camera.position);

  sunScreen.copy(camera.position).addScaledVector(sunDir, 500).project(camera);
  raysPass.uniforms.sunPos.value.set(sunScreen.x * 0.5 + 0.5, sunScreen.y * 0.5 + 0.5);
  raysPass.uniforms.strength.value = sunScreen.z < 1 ? 0.35 : 0.0;
  if (shadowFrames > 0) { renderer.shadowMap.needsUpdate = true; shadowFrames--; }
  if (heroTarget) {
    heroTarget.getWorldPosition(heroPos).y += 0.8;
    const dist = heroPos.distanceTo(camera.position);
    dofPass.material.uniforms.focusNear.value = dist * 0.5;  // everything from half the hero's distance outwards stays sharp
    dofPass.material.uniforms.blurNear.value = dist * 0.2;
    heroPos.project(camera);
    gradePass.uniforms.focusUv.value.set(heroPos.x * 0.5 + 0.5, heroPos.y * 0.5 + 0.5);
  }

  composer.render();
});
</script>
</body>
